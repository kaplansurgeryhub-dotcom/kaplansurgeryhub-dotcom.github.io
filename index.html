  if (j.slice(-1) === 's') u += '&entry.545380743=' + encodeURIComponent('סלקטיב · חודש נוסף בכירורגיה');

// its device sign-in and its last snapshot here, on this page, which Safari keeps. Only the Apps Script frame may ask, and only for these keys
(function () {

    if (e.source) e.source.postMessage({ ksh: 1, id: m.id, v: v }, e.origin);

// phone notifications (the daily-report reminder): this page holds the service worker and the Firebase token, because

  function sheet(who) {

    if (!ORIGIN.test(e.origin)) return; var m = e.data; if (!m || m.ksh !== 1 || (m.op !== 'push' && m.op !== 'pstate')) return;
