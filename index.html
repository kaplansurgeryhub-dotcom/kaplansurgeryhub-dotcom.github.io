<script>
// short registration link (?j=2611, ?j=2611s for selective, ?j=2611t for duties-only): go straight to the Google Form, with no frames in between
(function () {
  var j = new URLSearchParams(location.search).get('j');
  if (!j || !/^\d{4}[st]?$/.test(j)) return;
  var M = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'], m = +j.slice(2, 4);
  if (m < 1 || m > 12) return;
  var u = 'https://docs.google.com/forms/d/e/1FAIpQLSek3vnJqGsSwI_SzDtWD5OHKOTFgjrY23Xv6haDv0tzq7sS2g/viewform?usp=pp_url&entry.1733206774=' + encodeURIComponent(M[m - 1] + ' 20' + j.slice(0, 2));
  if (j.slice(-1) === 's') u += '&entry.545380743=' + encodeURIComponent('סלקטיב · חודש נוסף בכירורגיה');
  if (j.slice(-1) === 't') u += '&entry.545380743=' + encodeURIComponent('רק תורנויות · מגיע/ה לתורנויות בלבד');
  window.__go = u; location.replace(u);
})();
if (!window.__go) document.getElementById('app').src = 'https://script.google.com/macros/s/AKfycbzPCrw8mxFvs87Sph-W5FKSRxgulOtZWeV66a2bxFay2Ul2-tu8R2htsnIADUNoOEus/exec' + location.search;
</script>
