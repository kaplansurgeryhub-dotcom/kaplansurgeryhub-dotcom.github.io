// a tap on the dimmed backdrop no longer closes a window (5/11/2026, Guy: a light touch kicked him out). Closing is by ✕, a close button or Esc; a window with no close button still closes on a backdrop tap
(function () {
  const BG = '.mbg,.sheetbg,.k2bg,.crbg,.chbg,.fbbg,.gdbg,.nwpbg,.shbg';
  const CL = /^\s{0,3}(✕|×|✖|x|X|סגירה|סגור|ביטול|חזרה|לא עכשיו|הבנתי|סיום)\s{0,3}$/;
  const hasClose = t => !!t.querySelector('[data-x],.x,.chx,.mx,.mcl,[aria-label="סגירה"]') || [].some.call(t.querySelectorAll('button'), b => b.offsetParent !== null && CL.test(b.textContent || ''));
  const st = document.createElement('style'); st.textContent = '@keyframes bgNudge{0%,100%{transform:none}30%{transform:scale(1.012)}60%{transform:scale(.996)}}.bg-nudge>*{animation:bgNudge .28s ease}';
  (document.head || document.documentElement).appendChild(st);
  document.addEventListener('click', e => {
    const t = e.target; if (!t || !t.matches || !t.matches(BG) || !hasClose(t)) return;
    e.stopPropagation(); e.preventDefault(); t.classList.remove('bg-nudge'); void t.offsetWidth; t.classList.add('bg-nudge');
  }, true);
})();
// a call that answers a tap (a save, an approval, a page) shows the department's emblem in the middle of the screen with a ring running
// around it, after a quarter of a second, so a wait never looks stuck (11/11/2026, Dr. Gozani: instead of the thin green bar at the top,
// which not everyone noticed). CSS only, it does not hold anything up and does not block the screen. Background calls show nothing
(function () {
  let last = 0, n = 0, el = null, t = 0;
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { last = Date.now(); }, true));
  const EMB = 'https:' + '/' + '/kaplansurgeryhub-dotcom.github.io/ops/art/emblem.webp';
  const st = document.createElement('style'); st.textContent = '#kbusy{position:fixed;left:50%;top:50%;z-index:2147483000;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .2s,transform .2s;display:flex;flex-direction:column;align-items:center;gap:8px}#kbusy.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#kbusy .kb{position:relative;width:120px;height:120px;border-radius:50%;background:rgba(255,253,248,.96);box-shadow:0 10px 34px rgba(13,30,45,.28);display:grid;place-items:center}#kbusy .kb:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#3DC08C 75%,#1D3047 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:kbspin .9s linear infinite}#kbusy img{width:88px;height:88px;border-radius:50%;object-fit:contain}#kbusy small{font:700 14px Heebo,Arial,sans-serif;color:#1D3047;background:rgba(255,253,248,.92);padding:2px 10px;border-radius:99px;box-shadow:0 4px 12px rgba(13,30,45,.15)}@keyframes kbspin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#kbusy .kb:before{animation:none;background:#3DC08C}}';
  (document.head || document.documentElement).appendChild(st);
  const done = () => { n = Math.max(0, n - 1); if (!n) { clearTimeout(t); if (el) el.classList.remove('on'); } };
  window.kBusy = p => { if (Date.now() - last > 1200 || !p || !p.then) return p; n++; clearTimeout(t);
    t = setTimeout(() => { if (!n || !document.body) return; if (!el) { el = document.createElement('div'); el.id = 'kbusy'; el.setAttribute('role', 'status'); el.innerHTML = '<div class="kb"><img src="' + EMB + '" alt=""></div><small>רגע…</small>'; document.body.appendChild(el); } el.classList.add('on'); }, 250);
    p.then(done, done); return p; };
})();

<script>
// One copy for every page (13/11/2026, Dr. Gozani: the link copy did nothing on iPhone). Inside Google's frames the
// Clipboard API is often refused, so the old way runs first, still inside the tap. If both fail, a small sheet shows
// the text ready to copy by hand. Returns true when the copy surely worked.
window.kCopy = function (t) {
  t = String(t == null ? '' : t); let ok = false;
  try { const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0'; document.body.appendChild(a);
    const r = document.createRange(); a.contentEditable = 'true'; r.selectNodeContents(a); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); a.select(); a.setSelectionRange(0, t.length);
    ok = document.execCommand('copy'); a.remove(); s.removeAllRanges(); } catch (e) { ok = false; }
  if (ok) { try { navigator.clipboard && navigator.clipboard.writeText(t).catch(function () {}); } catch (e) {} return true; }
  const sheet = function () { const old = document.getElementById('kcpS'); if (old) old.remove(); const bg = document.createElement('div'); bg.id = 'kcpS';
    bg.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(12,42,53,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px';

.brand2{display:flex;align-items:center;gap:9px;flex:none;min-width:0}.brand2 img{width:38px;height:38px;border-radius:50%;border:2px solid #00967D;object-fit:cover;flex:none}
.brand2 b{display:block;font-family:var(--serif);font-size:16px;line-height:1.1}.brand2 small{display:block;color:#5CC79E;font-size:10.5px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.anav{display:flex;gap:2px}.anav button{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:14px;color:#C9D4D6}.anav svg{width:16px;height:16px}.anav button:hover{background:rgba(255,255,255,.08);color:#fff}
.anav button.on{background:linear-gradient(135deg,#00A87A,#00907A);color:#fff;box-shadow:0 6px 16px -6px rgba(0,168,122,.7)}
.who3{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px 4px 3px 10px;border-radius:999px}.who3:hover{background:rgba(255,255,255,.08)}.who3 span{display:flex;flex-direction:column;line-height:1.15;text-align:right}.who3 b{font-size:13.5px}.who3 small{color:#5CC79E;font-size:11px;font-weight:700}
.rfb{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#A9E6C9;font-size:17px}.rfb:hover{background:rgba(255,255,255,.08)}.rfb.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.nb{position:absolute;top:3px;left:8px;width:9px;height:9px;border-radius:50%;background:#E5533D;box-shadow:0 0 0 2px #0C2A35}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:rgba(7,28,36,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:3px 4px max(3px, var(--sb));box-shadow:0 -1px 0 rgba(111,211,168,.35)}
.tb button{all:unset;cursor:pointer;position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#8FA6AC;font-size:10.5px;font-weight:600;padding:4px 0;border-radius:10px;line-height:1.15}
.tb svg{width:21px;height:21px}.tb button.on{color:#A9E6C9}.tb button.on svg{filter:drop-shadow(0 0 6px rgba(169,230,201,.5))}.tb .nb{left:calc(50% - 16px);box-shadow:0 0 0 2px #071C24}
.av{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rc,#0A6B5A) center/cover no-repeat;color:#fff;font-style:normal;font-weight:800;font-size:14px;box-shadow:0 0 0 2px #0C2A35,0 0 0 3.5px #2BB58C}
.pvb{position:sticky;top:0;z-index:25;background:#FFF4D6;color:#6B4E10;border-bottom:1px solid #EBD597;font-weight:700;font-size:13px;text-align:center;padding:7px 12px}
.wrap2{max-width:1040px;margin:0 auto;padding:12px 12px 20px}
/* banners */
.ph{position:relative;overflow:hidden;border-radius:16px;background:radial-gradient(600px 260px at 85% -10%,rgba(61,192,140,.35),transparent 60%),linear-gradient(125deg,#06161D,#0C2A35 38%,#12404E 72%,#1B5A68);color:#F2F7F5;padding:16px 18px 18px;margin-bottom:12px;box-shadow:0 22px 44px -22px rgba(7,28,36,.75);isolation:isolate}
.ph:after{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,#0A6B5A,#00967D,#3DC08C,#A8D84A,#3DC08C)}
.ph img.anat{z-index:-1;mix-blend-mode:screen;left:-20px;top:50%;transform:translateY(-50%);width:min(40%,340px);opacity:.38;-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent);mask-image:linear-gradient(90deg,#000 30%,transparent)}
.phin{position:relative;display:flex;flex-direction:column;gap:4px}.phin>small{font-weight:800;letter-spacing:.12em;font-size:11.5px;background:linear-gradient(120deg,#3DC08C,#A8D84A);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph h2{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.15}.ph p{margin:0;color:#C9D6DA;font-size:14px}
/* cards */
.card{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin-bottom:12px;box-shadow:0 12px 28px -14px rgba(10,37,48,.3);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);min-width:0}
.card h2{margin:0 0 4px;font-family:var(--serif);font-weight:900;font-size:20px;letter-spacing:-.01em}.card h3{margin:0 0 6px;font-size:16px}
.cap{color:var(--muted);font-size:14px;margin:0 0 10px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.hd h2{margin:0}.hd .sp{flex:1}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.g2>.card{margin-bottom:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;background:linear-gradient(135deg,#00A87A,#00907A);color:#fff;font-weight:700;font-size:15px;text-align:center}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px}.btn.ghost{background:#E6F4F1;color:#0A6B5A}.btn.dark{background:linear-gradient(125deg,#071C24,#0C2A35 40%,#1B5160);color:#fff}.btn.wide{width:100%}.btn:disabled,.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--sand);border:1px solid var(--rule);border-radius:999px;padding:2px;gap:2px}.seg button{all:unset;cursor:pointer;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;color:var(--ink2)}.seg button.on{background:var(--navy);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:#E3F2EC;color:#0A6B5A}.tag.am{background:#FBF0D9;color:#8A5A10}.tag.red{background:#F8E1DB;color:var(--red)}.tag.mu{background:#EEF3F1;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--sb));transform:translateX(-50%);z-index:999;background:#0C2A35;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:18px 0 6px}.logos{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}.logos img{height:26px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:3px 6px}
/* "new" after a publish */
.pubnew{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.pubnew button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:10px;background:linear-gradient(125deg,#071C24,#0C2A35 45%,#1B5160);color:#fff;border-radius:12px;padding:9px 14px;box-shadow:0 10px 24px -12px rgba(10,37,48,.5)}
.pn-ic{font-size:22px}.pn-t{flex:1;display:flex;flex-direction:column;min-width:0}.pn-t em{font-style:normal;font-size:10.5px;font-weight:800;color:#0C2A35;background:#6FD3A8;border-radius:6px;padding:0 6px;align-self:flex-start}.pn-t b{font-size:15px}.pn-t small{color:#A9C7C2;font-size:12.5px}.pn-go{color:#6FD3A8;font-weight:800;font-size:13px;white-space:nowrap}
/* the daily report button */
.dtop{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(125deg,#00876F,#00A87A);color:#fff;box-shadow:0 14px 30px -14px rgba(0,135,111,.8)}
.dtop.late{background:linear-gradient(125deg,#8E2F20,#C2533D)}.dtop.ok{background:#fff;color:var(--navy);border:1px solid #BDE5D3;box-shadow:none}
.dt-ring{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:22px}.dtop.ok .dt-ring{background:#E3F2EC;color:var(--green);font-weight:900}
.dt-tx{flex:1;display:flex;flex-direction:column;min-width:0}.dt-tx em{font-style:normal;font-size:12px;font-weight:700;opacity:.85}.dt-tx b{font-size:17px}.dt-tx small{font-size:13px;opacity:.92}.dt-go{font-size:22px;font-weight:900}
.dmiss{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px;font-size:13.5px;font-weight:700;color:var(--red)}.dmiss button{all:unset;cursor:pointer;background:#F8E1DB;color:var(--red);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
/* the live monitor */
.imon{position:relative;overflow:hidden;isolation:isolate;border-radius:16px;background:radial-gradient(600px 260px at 85% -10%,rgba(61,192,140,.3),transparent 60%),linear-gradient(125deg,#06161D,#0C2A35 38%,#12404E 72%,#1B5A68);color:#F2F7F5;padding:12px 14px 10px;margin-bottom:12px;box-shadow:0 22px 44px -22px rgba(7,28,36,.75)}
.imon img.anat{z-index:-1;mix-blend-mode:screen;left:-30px;top:-30px;width:min(52%,420px);opacity:.3;-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent);mask-image:linear-gradient(90deg,#000 30%,transparent)}
.im-h{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:#A9C7C2;margin-bottom:8px;flex-wrap:wrap}.im-h .lv{display:inline-flex;align-items:center;gap:5px;color:#6FD3A8;font-weight:800;letter-spacing:.1em}.im-h .lv i{width:8px;height:8px;border-radius:50%;background:#36E0A0;box-shadow:0 0 8px #36E0A0;animation:blink 1.6s infinite}.im-h .who{color:#fff;font-size:15px;font-family:var(--serif);font-weight:900;letter-spacing:0}@keyframes blink{50%{opacity:.3}}
.ivt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.iv{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(169,230,201,.16);border-radius:12px;padding:8px 10px;border-top:3px solid var(--c,#3DC08C)}
.iv span{font-size:11.5px;color:#A9C7C2;font-weight:700}.iv b{font-size:22px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iv b.tx{font-size:16px;padding:3px 0 2px}.iv b small{font-size:12px;color:#A9C7C2;font-weight:700}.iv em{font-style:normal;font-size:11.5px;color:#C9D6DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv.cy{--c:#4FB3D9}.iv.am{--c:#E8B04A}.iv.vi{--c:#9C7BE0}.iv.rd{--c:#E5533D}.iv.wh{--c:#F2F7F5}
.itk{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px solid rgba(169,230,201,.14);padding-top:6px}.ek{flex:none;width:90px;height:26px}.ek svg{width:100%;height:100%}
.run{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.trk{display:flex;width:max-content;animation:tick var(--d,30s) linear infinite}.trk .set{display:flex;gap:28px;padding-inline-end:28px}.it{white-space:nowrap;font-size:13.5px;color:#DCE7E9}.it b{color:#fff}.it b.a{color:#FFC86B}.it b.g{color:#7FD8A8}.it b.c{color:#9FD3F0}
@keyframes tick{from{transform:translate3d(0,0,0)}to{transform:translate3d(50%,0,0)}}
@media (prefers-reduced-motion:reduce){.trk{animation:none}.im-h .lv i{animation:none}}
/* pre-rotation, intake, photo */
.pre{display:flex;gap:14px;align-items:center}.pre-num{flex:none;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(closest-side,#fff 78%,transparent 80% 100%),conic-gradient(#00967D var(--p,30%),#E3ECE8 0)}.pre-num b{font-size:26px;line-height:1;font-weight:900}.pre-num small{font-size:11.5px;color:var(--muted);font-weight:700}
.pre-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.pre-l>*{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;background:#F4F8F6;border:1px solid #E1EAE6;border-radius:12px;padding:9px 12px;font-size:14px}.pre-l>button,.pre-l>a{cursor:pointer}.pre-l b{font-size:14.5px}.pre-l span{color:var(--muted);font-size:12.5px}.pre-l .ok{background:#E8F6EF;border-color:#BDE5D3}
.icard{display:flex;gap:12px;align-items:center}.icard .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#E3F2EC}.icard>div{flex:1;min-width:0}.icard h2{font-size:18px}.icard p{margin:0;color:var(--ink2);font-size:14px}
.phcard{background:linear-gradient(125deg,#071C24,#0C2A35 45%,#1B5160);color:#fff;border-color:#0C2A35}.phcard.nag{box-shadow:0 0 0 2px #E8B04A,0 12px 28px -14px rgba(10,37,48,.5)}
.phc-now{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#33525C;font-size:22px;font-weight:800;position:relative;box-shadow:0 0 0 3px #0C2A35,0 0 0 4.5px #6FD3A8}.phc-now i{position:absolute;bottom:-2px;left:-2px;font-style:normal;font-size:16px;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.phcard p{color:#C9D6DA}.phcard em{font-style:normal;color:#6FD3A8;font-weight:700}
/* the rules */
.rl-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}.rl-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#E3F2EC;font-size:20px}
.rl-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rl{display:flex;flex-direction:column;gap:2px;background:#F6FAF8;border:1px solid #E1EAE6;border-radius:12px;padding:10px 12px;min-width:0}.rl i{font-style:normal;font-size:20px}.rl b{font-size:14.5px}.rl span{color:var(--ink2);font-size:13px}
.rl.must{background:#FFF7E8;border-color:#F0D9A8}
.gold{margin-top:10px;border-top:1px dashed #CBE0D6;padding-top:8px}.gold summary{cursor:pointer;font-weight:800;color:#0A6B5A;list-style:none}.gold summary small{background:#E3F2EC;border-radius:99px;padding:0 7px;font-size:12px}
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.tip{display:flex;gap:8px;align-items:flex-start}.tip .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px}.tip b{display:block;font-size:14px}.tip span{color:var(--ink2);font-size:13px}
/* my crew */
.crew{display:flex;gap:10px;flex-wrap:wrap}
.cwc{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;text-align:center}
.cwc-p{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#DCE7E3 center/cover no-repeat;font-weight:800;color:#0A6B5A;box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ring,#CFC6B4);position:relative}
.cwc-n{font-size:12.5px;font-weight:700;line-height:1.2;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cwc-t{font-size:11px;font-weight:800;color:#fff;background:var(--sc,#7A8A90);border-radius:6px;padding:0 6px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cwc-k{font-size:10.5px;color:var(--muted);font-weight:700}
.cwc.me .cwc-n{color:#0A6B5A}
.mwd{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #EEF3F1}.mwd:first-child{border-top:0}.mwd .dd{flex:none;width:44px;text-align:center;border-radius:10px;background:#F1F5F3;padding:3px 0;line-height:1.15}.mwd .dd b{display:block;font-size:14px}.mwd .dd small{font-size:11px;color:var(--muted)}
.mwd.t .dd{background:var(--navy);color:#fff}.mwd.t .dd small{color:#6FD3A8}.mwd .ds{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700;font-size:14.5px;border-inline-start:4px solid var(--sc,#CBD8D2);padding-inline-start:8px}.mwd .ds small{font-weight:600;color:var(--muted);font-size:12.5px}.mwd .x{color:var(--red)}
/* requests */
.rqm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rqm .tx{flex:1 1 180px;display:flex;flex-direction:column;min-width:0}.rqm .tx b{font-size:15px}.rqm .tx small{color:var(--muted);font-size:13px}.rqm .tx em{font-style:normal;color:#0A6B5A;font-weight:800}
.rq-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.rq-tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:12px 14px;background:#E8F6EF;border:1px solid #BDE5D3}.rq-tile.dark{background:linear-gradient(125deg,#071C24,#0C2A35 45%,#1B5160);color:#fff;border-color:#0C2A35}.rq-tile b{font-size:15.5px}.rq-tile span{font-size:13px;opacity:.85}.rq-tile[disabled]{opacity:.5;cursor:default}
.rq-l{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:7px 0;border-top:1px solid #EEF3F1;font-size:14px}.rq-l b{flex:none;font-size:13px}.rq-l.ok b{color:var(--green)}.rq-l.no b{color:var(--red)}.rq-l small{display:block;color:var(--muted);font-size:12.5px}
/* messages from the staff */
.msg{display:flex;gap:10px;padding:9px 0;border-top:1px solid #EEF3F1}.msg:first-of-type{border-top:0}.msg .mi{font-size:20px}.msg b{font-size:15px}.msg p{margin:2px 0;color:var(--ink2);font-size:14px;white-space:pre-line}.msg small{color:var(--muted);font-size:12px}.msg.mine{background:#F4FBF7;border-radius:10px;padding:9px 10px}
/* the pulse */
.ipl{display:grid;grid-template-columns:1fr 1fr;gap:16px}.im{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}.im .l{font-weight:700;font-size:14px}.im .l small{display:block;color:var(--muted);font-weight:600;font-size:12px}.im .v{font-weight:800}.im .bar{grid-column:1/-1;height:8px;border-radius:99px;background:#EEF3F1;overflow:hidden}.im .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#00967D,#3DC08C)}
.ig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}.ig .r{position:relative;width:64px;height:64px;margin:0 auto}.ig .r svg{width:100%;height:100%;transform:rotate(-90deg)}.ig .r b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}.ig span{display:block;font-size:12.5px;font-weight:700}.ig small{font-size:11.5px;font-weight:800}.ig .up{color:var(--green)}.ig .dn{color:var(--red)}.ig .eq{color:var(--muted)}
/* the weekly plan (from the Hub) */
.wp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.wp-h h2{margin:0}.wp-h .sp{flex:1}
.wkfull{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 11px;border-radius:999px;background:linear-gradient(135deg,#0C2A35,#155063);color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 14px rgba(12,42,53,.22);white-space:nowrap}.wkfull svg{width:17px;height:17px;flex:none}
.wp-grid{display:grid;grid-template-columns:118px repeat(var(--n),minmax(0,1fr));gap:6px}
.wp-d{text-align:center;padding:8px 4px;border-radius:12px;background:#F1F5F3}.wp-d b{display:block;font-size:14px}.wp-d small{color:var(--muted);font-size:12px}.wp-d.t{background:#0C2A35;color:#F1F5F3}.wp-d.t small{color:#3DC08C}
.wp-r{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:6px 2px}.wp-r i{font-style:normal}
.wp-x{display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-radius:12px;background:#F8FBFA;border:1px solid #E6EEEA;min-width:0}.wp-x.t{border-color:#00967D;box-shadow:0 0 0 1px #00967D inset}.wp-x.p,.wp-day.p{opacity:.62}

function cropDialog(src) { return new Promise(done => {

<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bd = s => esc(s).replace(/(\d+[–-]\d+)/g, '<bdi dir="ltr">$1</bdi>');
  const rpc = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
  const lsg = k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, lss = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  let F = null, O = null, st = null, el = null;
  const id = () => F.pop + '_' + F.wave + '_' + F.tp;
  const steps = () => F.items.concat(F.open);
  function save() { if (!O.pv) lss('ksrs_d_' + id(), JSON.stringify({ a: st.a, i: st.i })); }
  function close() { if (el) el.remove(); el = null; document.documentElement.style.overflow = ''; }
  function frame(head, body, foot) {
    if (!el) { el = document.createElement('div'); el.className = 'ksrs'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); document.documentElement.style.overflow = 'hidden'; }
    el.innerHTML = `<div class="rs-c">${O.pv ? '<div class="rs-pv">👁 תצוגה מקדימה · שום דבר לא נשמר</div>' : ''}<div class="rs-h"><div class="rs-k">מערך כירורגיה כללית · קפלן</div><h2>${esc(F.title)}</h2>${head || ''}<button class="rs-x" data-x aria-label="סגירה">✕</button></div><div class="rs-b">${body}</div>${foot ? `<div class="rs-f">${foot}</div>` : ''}</div>`;
    el.querySelector('[data-x]').onclick = () => { if (st.i > 0 && st.i <= steps().length) save(); close(); };
    const c = el.querySelector('.rs-c'); if (c) c.scrollTop = 0;
  }
  function intro() {
    const n = F.items.length;
    frame('', `<span class="rs-pill">⏱ כ-${F.min} דקות · ${n} שאלות קצרות${F.open.length ? ' ועוד שאלה פתוחה אחת או שתיים (רשות)' : ''}</span>
      <p class="rs-lead">${F.first ? 'שלום ' + esc(F.first) + ', ' : ''}${esc(F.lead)}</p>
      <div class="rs-box">🔒 ${esc(F.privacy)}</div>
      <div class="rs-box rs-rsch"><b>שימוש במחקר · רשות</b><br>${esc(F.research)}
        <label class="rs-chk"><input type="checkbox" id="rsCons" ${st.c ? 'checked' : ''}><span>${esc(F.consent)}</span></label></div>
      <p class="rs-pi">${esc(F.pi)}</p>`,
      `<button class="rs-btn rs-go" id="rsGo">${st.i > 0 ? 'ממשיכים מאיפה שעצרתי' : 'מתחילים'}</button><button class="rs-btn rs-sec" id="rsLater">אחר כך</button>`);
    el.querySelector('#rsCons').onchange = e => { st.c = e.target.checked; };
    el.querySelector('#rsGo').onclick = () => { st.i = Math.max(1, st.i); q(); };
    el.querySelector('#rsLater').onclick = () => { if (!O.pv) lss('ksrs_snz_' + id(), today()); close(); };
  }
  function q() {
    const L = steps(), k = st.i - 1; if (k >= L.length) return review();
    const x = L[k], v = st.a[x.id], pct = Math.round(k / (L.length + 1) * 100);
    const head = `<div class="rs-pb"><i style="width:${pct}%"></i></div><div class="rs-n">שאלה ${k + 1} מתוך ${L.length}${x.k === 'tx' ? ' · רשות' : ''}</div>`;
    let body = `<div class="rs-q">${bd(x.t)}</div>${k === 0 && F.hint ? `<p class="rs-hint">${esc(F.hint)}</p>` : x.k === 'l7' ? '<p class="rs-hint">מ-1 עד 7</p>' : ''}`;
    if (x.k === 'l5') body += `<div class="rs-opts">${F.scale5.map((t, i) => `<button class="rs-o ${v === i + 1 ? 'on' : ''}" data-v="${i + 1}"><em>${i + 1}</em><span>${esc(t)}</span></button>`).join('')}</div>`;
    else if (x.k === 'l7') body += `<div class="rs-sev">${[1, 2, 3, 4, 5, 6, 7].map(i => `<button class="rs-o ${v === i ? 'on' : ''}" data-v="${i}" aria-label="${i}">${i}</button>`).join('')}</div><div class="rs-ends"><span>1 · ${esc(F.scale7[0])}</span><span>7 · ${esc(F.scale7[1])}</span></div>`;
    else if (x.k === 'ch') body += `<div class="rs-opts">${x.o.map((t, i) => `<button class="rs-o ${v === i + 1 ? 'on' : ''}" data-v="${i + 1}"><em>${i + 1}</em><span>${bd(t)}</span></button>`).join('')}</div>`;
    else body += `<textarea id="rsTx" maxlength="600" placeholder="אפשר לכתוב בחופשיות, בלי שמות של אנשים">${esc(v || '')}</textarea>`;
    if (x.na) body += `<button class="rs-na ${v === 'na' ? 'on' : ''}" data-v="na">${esc(F.na)}</button>`;
    const isTx = x.k === 'tx';
    frame(head, body, `<button class="rs-btn rs-sec" id="rsBack">‹ הקודם</button><button class="rs-btn rs-go" id="rsNext" ${!isTx && v == null ? 'disabled' : ''}>${isTx ? (v ? 'המשך' : 'דילוג') : 'המשך'}</button>`);
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const val = b.dataset.v === 'na' ? 'na' : +b.dataset.v; st.a[x.id] = val; save();
      el.querySelectorAll('[data-v]').forEach(y => y.classList.toggle('on', y === b)); el.querySelector('#rsNext').disabled = false;
      setTimeout(() => { if (el && st.i === k + 1) { st.i++; q(); } }, 260); });
    const ta = el.querySelector('#rsTx'); if (ta) ta.oninput = () => { st.a[x.id] = ta.value; el.querySelector('#rsNext').textContent = ta.value.trim() ? 'המשך' : 'דילוג'; save(); };
    el.querySelector('#rsBack').onclick = () => { st.i--; if (st.i < 1) { st.i = 0; intro(); } else q(); };
    el.querySelector('#rsNext').onclick = () => { st.i++; save(); q(); };
  }
  function review() {
    const L = steps(), miss = F.items.filter(x => st.a[x.id] == null);
    frame(`<div class="rs-pb"><i style="width:100%"></i></div><div class="rs-n">כמעט סיימנו</div>`,
      `<div class="rs-q">סיימת את כל ${L.length} השאלות 🙌</div><p class="rs-hint">אפשר לחזור אחורה ולשנות. כשמוכנים, שולחים.</p>
      <div class="rs-box rs-rsch"><b>שימוש במחקר · רשות</b><label class="rs-chk"><input type="checkbox" id="rsCons2" ${st.c ? 'checked' : ''}><span>${esc(F.consent)}</span></label></div>
      ${miss.length ? `<p class="rs-err">חסרות ${miss.length} תשובות בסולם. חוזרים אליהן עם "הקודם".</p>` : ''}<div id="rsErr" class="rs-err"></div>`,
      `<button class="rs-btn rs-sec" id="rsBack">‹ הקודם</button><button class="rs-btn rs-go" id="rsSend" ${miss.length ? 'disabled' : ''}>שליחה</button>`);
    el.querySelector('#rsCons2').onchange = e => { st.c = e.target.checked; };
    el.querySelector('#rsBack').onclick = () => { st.i = L.length; q(); };
    el.querySelector('#rsSend').onclick = async () => { const b = el.querySelector('#rsSend'); b.disabled = true; b.textContent = 'שולח…';
      const ans = {}; L.forEach(x => { const v = st.a[x.id]; if (v != null && v !== '') ans[x.id] = v; });
      try { const r = O.pv ? { ok: true, support: false } : await rpc('ops_rsSave', O.key, F.wave, F.tp, ans, !!st.c); lss('ksrs_d_' + id(), null); thanks(r && r.support); }
      catch (e) { b.disabled = false; b.textContent = 'שליחה'; el.querySelector('#rsErr').textContent = (e && e.message) || 'השליחה נכשלה. נסו שוב'; } };
  }
  function thanks(sup) {
    frame('', `<div class="rs-done"><div class="ok">✓</div><div class="rs-q">${esc(F.thanks)}</div><p class="rs-hint">${st.c ? 'בחרת שהתשובות ישמשו גם למחקר, בעילום שם. תודה!' : 'התשובות ישמשו להערכת התוכנית בלבד.'}</p></div>${sup ? `<div class="rs-box">💚 ${esc(F.support)}</div>` : ''}`,
      `<button class="rs-btn rs-go" id="rsEnd">סגירה</button>`);
    el.querySelector('#rsEnd').onclick = close;
  }
  /** o = { key: the personal token, pv: preview, force: open even if snoozed } */
  async function check(o) {
    O = o || {}; if (!O.key || el) return null;
    let r; try { r = await rpc('ops_rsMe', O.key, O.pv ? 'pv' : ''); } catch (e) { return null; }
    if (!r || !r.due) return r;
    F = r.due; st = { i: 0, a: {}, c: false };
    if (!O.force && !O.pv && lsg('ksrs_snz_' + id()) === today()) return r;
    try { const d = JSON.parse(lsg('ksrs_d_' + id()) || 'null'); if (d && d.a) { st.a = d.a; st.i = Math.min(d.i || 0, steps().length); } } catch (e) {}
    intro(); return r;
  }
  /** on entering the app: waits while another window is open (profile, terms, photo) or the app is not ready, then checks once.
      In the owner's preview (pv) only with &rspv=1 in the address, so a preview of the app is not covered by the questionnaire */
  function auto(o) {
    if (o.pv && !/[?&]rspv=1/.test((window.QS_ || location.search))) return;
    let n = 0; const t = () => { if (++n > 48 || el) return; let busy = false; try { busy = (o.wait && document.querySelector(o.wait)) || (o.ready && !o.ready()); } catch (e) { busy = true; }
      if (busy) { setTimeout(t, 2500); return; } check(o); };
    setTimeout(t, o.delay || 2500);
  }
  window.KSRS = { check: check, auto: auto, close: close };
})();
</script>

};
function qkTiles() {
  const n = qkSrc().secs.reduce((a, s) => a + (s.rows || []).length, 0);
  return `<div class="qkrow"><button class="qkt ph" data-qk="ph"><span class="qic">${QKI.phone}</span><span><b>טלפונים חיוניים</b><small>צוות החייאה, מרדים, טיפול נמרץ, ביטחון · ${n} מספרים</small></span><span class="qgo">›</span></button>

document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-qk]'); if (b) { e.preventDefault(); qkOpen(b.dataset.qk); } });
function qkPhones() {
  const D = qkSrc();
  return `<p class="qkhint">מטלפון של בית החולים מחייגים את השלוחה (4 ספרות). מהנייד: "חיוג" מחייג את המספר המלא. לחיצה על השלוחה מעתיקה אותה.</p>` + D.secs.map(s => { let lastG = '';
    return `<section class="qps ${QK_C[s.c] ? s.c : 'navy'}"><h4>${QKI[s.ic] || QKI.phone}<span>${qkE(s.t)}${s.s ? `<small>${qkE(s.s)}</small>` : ''}</span></h4>${(s.rows || []).map(r => { const g = r.g && r.g !== lastG ? `<div class="qpg">${qkE(r.g)}</div>` : ''; lastG = r.g || '';
      return g + `<div class="qpr"><span class="qnm">${qkE(r.l)}</span>${r.x ? `<button class="qpx" data-qx="${qkE(r.x)}" aria-label="העתקת שלוחה ${qkE(r.x)}">${qkE(r.x)}</button>` : ''}${qkTel(r.p) ? `<a class="qpd" href="tel:${qkTel(r.p)}" aria-label="חיוג ל${qkE(r.l)}">${QKI.phone}${qkE(r.p)}</a>` : ''}</div>`; }).join('')}</section>`; }).join('') +
    `<p class="qkfoot">מתוך כרטיס "טלפונים חיוניים" של המרכז הרפואי קפלן${window.QP_EDIT && QP_EDIT() ? ' · עריכה: הגדרות ← טלפונים חיוניים' : ''}</p>`;

function qkCpr() {
  const st = (n, art, t, s, extra, full) => `<div class="qcst"><span class="qn">${n}</span><span class="qart">${art}</span><div style="flex:1;min-width:0"><b>${t}</b>${s ? `<small>${s}</small>` : ''}${extra || ''}</div>${full ? `<div class="qcx">${full}</div>` : ''}</div>`;
  const cab = `<div class="qcab">${[['C', QKA.pulse, 'בדיקת דופק בעורק הצוואר', 'עד 10 שניות. אם אין, או לא בטוח: מתחילים בעיסויים'], ['A', QKA.airway, 'פתיחת נתיב אוויר', 'הטיית הראש אחורה'], ['B', QKA.breath, 'התרשמות מנשימה', 'האם יש עלייה וירידה סדירה של בית החזה. אם לא נושם: הנשמה במפוח הנשמה ידני (אמבו), במידה וזמין']]
    .map(([l, a, t, s]) => `<div class="qr"><span class="ql">${l}</span><span class="qart">${a}</span><span class="qtt"><b>${t}</b> · ${s}</span></div>`).join('')}</div>`;
  const tips = [['הנח ידיים במרכז בית החזה', '✋'], ['עיסויים על מצע קשיח', '▭'], ['קצב 100–120 עיסויים בדקה', '♪'], ['עיסויים עמוקים', '↓'], ['הרפיה מלאה של בית החזה', '↑'], ['עיסויים ברצף, בלי הפסקות', '∞'], ['בדיקת דופק כל 2 דקות', '⏱']];

    <div class="qcs">${st(1, QKA.call, 'הזעק צוות החייאה וקרא לעזרה', 'טלפונים: בלשונית "טלפונים חיוניים"', `<button class="qpx" style="--qc:#B5483A;--qc3:#F8E7E3;margin-top:6px;font-size:13px" data-qkgo="ph">לטלפונים ›</button>`)}
    ${st(2, QKA.cart, 'קרב עגלת החייאה ודפיברילטור', 'במידה וזמין')}

}
// המטרונום הוסר (9/11/2026, החלטת ד״ר גוזני): בלי שום צליל בכרטיס ההחייאה. qkMetStop נשאר ריק כדי שהקריאות הקיימות לא ישברו
function qkMetStop() {}
function qkOpen(tab) {
  document.querySelectorAll('.qkbg').forEach(x => x.remove()); qkMetStop();
  const bg = document.createElement('div'); bg.className = 'qkbg'; bg.setAttribute('role', 'dialog'); bg.setAttribute('aria-modal', 'true');
  const draw = t => { bg.innerHTML = `<div class="qk"><div class="qkh"><div class="qtabs"><button data-qt="ph" class="${t === 'ph' ? 'qon' : ''}">טלפונים חיוניים</button><button data-qt="cpr" class="${t === 'cpr' ? 'qon' : ''}">עקרונות החייאה</button></div><button class="qx" data-x="1" aria-label="סגירה">✕</button></div><div class="qkb">${t === 'ph' ? qkPhones() : qkCpr()}</div></div>`;
    bg.querySelectorAll('[data-qt]').forEach(b => b.onclick = () => { qkMetStop(); draw(b.dataset.qt); });
    bg.querySelectorAll('[data-qkgo]').forEach(b => b.onclick = () => { qkMetStop(); draw(b.dataset.qkgo); });
    bg.querySelectorAll('[data-qx]').forEach(b => b.onclick = () => { const v = b.dataset.qx; try { kCopy(v); } catch (e) {} const o = b.textContent; b.textContent = '✓ הועתק'; setTimeout(() => { b.textContent = o; }, 1100); });
    bg.querySelector('[data-x]').onclick = close; };
  const close = () => { qkMetStop(); bg.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc); document.body.appendChild(bg); draw(tab === 'cpr' ? 'cpr' : 'ph');
}
// the owner's editor (settings): sections with a title, a line, a color, and rows of name, extension and phone
function qkEdit(cur, onSave) {
  let D = JSON.parse(JSON.stringify(cur && cur.secs && cur.secs.length ? cur : QP_DEF));
  const bg = document.createElement('div'); bg.className = 'qkbg';
  const draw = () => { bg.innerHTML = `<div class="qk"><div class="qkh"><div class="qtabs"><button class="qon">עריכת טלפונים חיוניים</button></div><button class="qx" data-x="1" aria-label="סגירה">✕</button></div><div class="qkb qked">
    <p class="qkhint">כל הצוות רואה את הרשימה מהאריח במסך הבית. שלוחה: 4 ספרות. טלפון: המספר המלא. "קבוצה" היא כותרת קטנה מעל כמה שורות (למשל "אח/ות מנהל/ת תורן/נית").</p>
    ${D.secs.map((s, i) => `<div class="qsec"><div class="qhd"><input data-s="${i}" data-f="t" value="${qkE(s.t)}" placeholder="כותרת" aria-label="כותרת"><input data-s="${i}" data-f="s" value="${qkE(s.s || '')}" placeholder="מתי מתקשרים" aria-label="שורה"><select data-s="${i}" data-f="c" aria-label="צבע">${Object.keys(QK_C).map(k => `<option value="${k}" ${s.c === k ? 'selected' : ''}>${QK_C[k]}</option>`).join('')}</select><button class="qdl" data-ds="${i}" aria-label="מחיקת קבוצה">✕</button></div>
      ${(s.rows || []).map((r, j) => `<div class="qrw"><input data-s="${i}" data-r="${j}" data-f="l" value="${qkE(r.g ? r.g + ' · ' + r.l : r.l)}" placeholder="שם" aria-label="שם"><input data-s="${i}" data-r="${j}" data-f="x" value="${qkE(r.x || '')}" placeholder="שלוחה" inputmode="numeric" aria-label="שלוחה"><input data-s="${i}" data-r="${j}" data-f="p" value="${qkE(r.p || '')}" placeholder="טלפון" inputmode="tel" dir="ltr" aria-label="טלפון"><button class="qdl" data-dr="${i}|${j}" aria-label="מחיקה">✕</button></div>`).join('')}
      <button class="btn sm" data-ar="${i}" style="margin-top:8px">＋ מספר</button></div>`).join('')}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="qkAs">＋ קבוצה</button><button class="btn sm" id="qkDef">↺ חזרה לכרטיס של בית החולים</button><span style="flex:1"></span><button class="btn primary" id="qkSv">שמירה</button></div></div></div>`;
    bg.querySelector('[data-x]').onclick = () => bg.remove();
    bg.querySelectorAll('input[data-f],select[data-f]').forEach(e => e.oninput = e.onchange = () => { const s = D.secs[+e.dataset.s];
      if (e.dataset.r == null) { s[e.dataset.f] = e.value; return; } const r = s.rows[+e.dataset.r];
      if (e.dataset.f === 'l') { const k = e.value.indexOf(' · '); if (k > 0) { r.g = e.value.slice(0, k); r.l = e.value.slice(k + 3); } else { delete r.g; r.l = e.value; } } else r[e.dataset.f] = e.value; });
    bg.querySelectorAll('[data-ar]').forEach(b => b.onclick = () => { D.secs[+b.dataset.ar].rows.push({ l: '', x: '', p: '' }); draw(); });
    bg.querySelectorAll('[data-dr]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.dr.split('|'); D.secs[+i].rows.splice(+j, 1); draw(); });
    bg.querySelectorAll('[data-ds]').forEach(b => b.onclick = () => { if (b.dataset.sure) { D.secs.splice(+b.dataset.ds, 1); draw(); } else { b.dataset.sure = 1; b.textContent = '?'; } });
    bg.querySelector('#qkAs').onclick = () => { D.secs.push({ t: 'קבוצה חדשה', s: '', c: 'navy', rows: [{ l: '', x: '', p: '' }] }); draw(); };
    bg.querySelector('#qkDef').onclick = () => { D = JSON.parse(JSON.stringify(QP_DEF)); draw(); };
    bg.querySelector('#qkSv').onclick = async () => {
      const out = { secs: D.secs.map(s => ({ t: String(s.t || '').trim().slice(0, 60), s: String(s.s || '').trim().slice(0, 80), c: QK_C[s.c] ? s.c : 'navy', ic: s.ic || '', rows: (s.rows || []).map(r => Object.assign(r.g ? { g: String(r.g).trim().slice(0, 50) } : {}, { l: String(r.l || '').trim().slice(0, 60), x: String(r.x || '').replace(/[^0-9]/g, '').slice(0, 6), p: String(r.p || '').replace(/[^0-9+\-\s]/g, '').trim().slice(0, 20) })).filter(r => r.l && (r.x || r.p)) })).filter(s => s.t && s.rows.length).slice(0, 12) };
      try { await onSave(out); bg.remove(); } catch (e) { alert(e.message || e); } }; };
  document.body.appendChild(bg); draw();
}

    let type = 'bug', tab = start || (isO ? 'in' : 'send'), inbox = null, mine = null, cur = '', flt = 'act', q = '', att = null, link = '', showLink = false, busy = false;
    const bg = document.createElement('div'); bg.className = 'fbbg'; bg.setAttribute('role', 'dialog'); bg.setAttribute('aria-modal', 'true'); bg.setAttribute('aria-label', 'משוב ופנייה');
    const load = async () => { try { if (isO) inbox = await run('ops_fbList', [a.v]); else mine = await run('ops_fbMine', [a.k, a.v]); } catch (e) { if (isO) inbox = []; else mine = []; } draw(); paintBadge(isO ? (inbox || []).filter(unread).length : (mine || []).filter(repNew).length); };
    const list = () => (isO ? inbox : mine) || [];
    const shown = () => list().filter(x => !isO ? true : flt === 'act' ? ['new', 'open'].indexOf(x.st || 'new') >= 0 || unread(x) : flt === 'un' ? unread(x) : flt === 'star' ? x.star : flt === 'done' ? x.st === 'done' : flt === 'arch' ? x.st === 'arch' : x.st !== 'arch')
      .filter(x => !q || (x.by + ' ' + x.text + ' ' + (x.rep || []).map(m => m.text).join(' ')).indexOf(q) >= 0);
    const bub = (m, x) => { const me = isO ? !m.s : !!m.s; return `<div class="fbb ${me ? 'me' : 'them'}"><small>${esc(m.by || '')} · ${esc(when(m.at))}</small>${esc(m.text || '')}${m.link ? '<br>' + linkHtml(m.link) : ''}${m.fid ? `<br><button class="att" data-fbf="${esc(m.fid)}" data-fbx="${esc(x.id)}">📎 ${esc(m.fname || 'קובץ')}</button>` : ''}</div>`; };
    const composer = (x, ownerSide) => `<div class="fbcmp">${ownerSide ? `<div class="fbq">${QUICK.map((s, i) => `<button data-fbq="${i}">${esc(s)}</button>`).join('')}</div>` : ''}<textarea id="fbRe" maxlength="1500" placeholder="${ownerSide ? 'תשובה ל' + esc(x.by) + '…' : 'הוספת תגובה…'}"></textarea>
      ${showLink || att ? `<div class="fbatt">${att ? `<span>📎 ${esc(att.name)} <button class="fbback" style="margin:0" data-fbunatt="1">✕</button></span>` : ''}${showLink ? `<input id="fbLk" placeholder="הדבקת קישור (https)" value="${esc(link)}">` : ''}</div>` : ''}
      <div class="fbcb"><label>📎 צירוף קובץ<input type="file" id="fbFi" accept="image/png,image/jpeg,image/webp,image/heic,application/pdf" hidden></label><button data-fblk="1">🔗 קישור</button><span class="sp"></span>${ownerSide ? '<button class="go2" id="fbSendDone">שליחה וסימון טופל</button>' : ''}<button class="go" id="fbSendRe">שליחה</button></div><div class="fbmsg" id="fbRm" aria-live="polite"></div></div>`;
    const thread = x => {
      const ph = isO && window.FB_PHONE ? (window.FB_PHONE(x.by) || '') : '';
      return `<div class="fbth"><button class="fbback" data-fbback="1">› לכל הפניות</button>
        <div class="meta"><b>${esc(isO ? x.by : 'הפנייה שלי')}</b>${isO ? `<span>${esc(RL[x.role] || x.role || '')}</span>` : ''}<span class="fbtag ${esc(x.type)}">${esc(TYS[x.type] || '')}</span><span class="fbtag st-${esc(x.st || 'new')}">${esc(STL[x.st || 'new'])}</span><span>${esc(when(x.at))}</span>${isO && (x.where || x.dev) ? `<span>· ${esc([x.where, x.dev].filter(Boolean).join(' · '))}</span>` : ''}</div>
        ${isO ? `<div class="fbacts"><button data-fbst="open" class="${x.st === 'open' ? 'on' : ''}">⏳ בטיפול</button><button data-fbst="done" class="${x.st === 'done' ? 'on' : ''}">✓ טופל</button><button data-fbstar="1" class="${x.star ? 'on' : ''}">⭐ ${x.star ? 'מסומן' : 'סימון'}</button><button data-fbun="1">● לא נקרא</button><button data-fbcp="1">📋 העתקה</button>${ph ? `<button data-fbwa="${esc(ph)}">💬 וואטסאפ</button>` : ''}<button data-fbst="${x.st === 'arch' ? 'open' : 'arch'}">${x.st === 'arch' ? '↺ מהארכיון' : '🗄 ארכיון'}</button></div>` : ''}
        ${bub({ by: isO ? x.by : 'אני', at: x.at, text: x.text, s: 1 }, x)}${(x.rep || []).map(m => bub(m, x)).join('')}
        ${isO ? `<div class="fbnote"><small>📝 הערה פנימית · רק אצלך</small><textarea id="fbNote" maxlength="800" placeholder="למשל: לבדוק בטלפון של מילר · נכנס לעדכון של יום חמישי">${esc(x.note || '')}</textarea></div>` : ''}
        ${composer(x, isO)}</div>`; };
    const row = x => { const un = isO ? unread(x) : repNew(x), n = (x.rep || []).length;
      return `<button class="fbrow${un ? ' un' : ''}${x.st === 'done' ? ' done' : ''}" data-fbo="${esc(x.id)}"><span class="dt"></span><span class="who"><b>${esc(isO ? x.by : (TYS[x.type] || 'פנייה'))}</b>${isO ? `<span>${esc(RL[x.role] || x.role || '')}</span><span class="fbtag ${esc(x.type)}">${esc(TYS[x.type] || '')}</span>` : ''}<span class="fbtag st-${esc(x.st || 'new')}">${esc(STL[x.st || 'new'])}</span>${x.star ? '⭐' : ''}${n ? `<span>💬 ${n}</span>` : ''}</span><span class="mt">${esc(when(last(x)))}</span><span class="pv">${esc(x.text)}</span></button>`; };
    const draw = () => {
      const L = list(), x = cur ? L.find(y => y.id === cur) : null, nIn = isO ? L.filter(unread).length : L.filter(repNew).length;
      bg.innerHTML = `<div class="fbm${isO || tab === 'in' ? ' wide' : ''}"><div class="hd"><h3>${isO ? '📥 תיבת המשוב' : '💬 משוב ופנייה'}</h3><button class="xx" id="fbX" aria-label="סגירה">✕</button></div>
        <div class="fbtabs">${isO ? `<button data-ft="in" aria-pressed="${tab === 'in'}">התקבלו${badge(nIn)}</button><button class="sec" data-ft="send" aria-pressed="${tab === 'send'}">✏️ שליחת משוב</button>`
          : `<button data-ft="send" aria-pressed="${tab === 'send'}">שליחה</button><button data-ft="in" aria-pressed="${tab === 'in'}">הפניות שלי${badge(nIn)}</button>`}</div>` +
        (tab === 'send' ? `<p class="s">נתקלת בתקלה? יש רעיון לשיפור? כתבו כאן בקצרה. ההודעה נשלחת ישר לד״ר גוזני, עם השם שלך והמסך שבו את/ה נמצא/ת. התשובה תופיע כאן, ב"הפניות שלי".</p><div class="fbt">${TY.map(([k, l]) => `<button data-fty="${k}" aria-pressed="${type === k}">${l}</button>`).join('')}</div><textarea id="fbTx" maxlength="900" placeholder="למשל: במסך התוכנית השבועית הכפתור לא עובד בטלפון"></textarea><div class="fbmsg" id="fbMsg" aria-live="polite"></div><div class="fbr"><button class="go" id="fbGo">שליחה</button></div>`
          : !list() || (isO ? !inbox : !mine) ? '<p class="s">טוען…</p>'
          : x ? thread(x)
          : `${isO ? `<div class="fbfl">${[['act', 'פתוחות'], ['un', 'לא נקראו'], ['star', '⭐ מסומנות'], ['done', 'טופלו'], ['arch', 'ארכיון'], ['all', 'הכול']].map(([k, l]) => `<button data-fbfl="${k}" aria-pressed="${flt === k}">${l}</button>`).join('')}<input id="fbQ" placeholder="חיפוש" value="${esc(q)}"></div>` : ''}
             ${shown().length ? shown().map(row).join('') : `<div class="fbempty">${isO ? (flt === 'act' ? 'אין פניות פתוחות 🎉' : 'אין פניות כאן') : 'עוד לא שלחת פניות'}</div>`}`) + `</div>`;
      const qs = s => bg.querySelector(s), all = (s, f) => bg.querySelectorAll(s).forEach(f);
      qs('#fbX').onclick = () => bg.remove();
      all('[data-ft]', b => b.onclick = () => { tab = b.dataset.ft; cur = ''; draw(); if (tab === 'in' && !(isO ? inbox : mine)) load(); });
      all('[data-fty]', b => b.onclick = () => { type = b.dataset.fty; all('[data-fty]', y => y.setAttribute('aria-pressed', String(y === b))); });
      all('[data-fbfl]', b => b.onclick = () => { flt = b.dataset.fbfl; draw(); });
      if (qs('#fbQ')) qs('#fbQ').oninput = e => { q = e.target.value.trim(); const pos = e.target.selectionStart; draw(); const f = qs('#fbQ'); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (er) {} } };
      all('[data-fbo]', b => b.onclick = async () => { cur = b.dataset.fbo; att = null; link = ''; showLink = false; draw(); const it = list().find(y => y.id === cur);
        try { if (isO && it && unread(it)) { inbox = await run('ops_fbAct', [a.v, cur, 'read']); paintBadge(inbox.filter(unread).length); } else if (!isO && it && repNew(it)) { await run('ops_fbMineSeen', [a.k, a.v, cur]); it.rs = new Date().toISOString(); paintBadge(mine.filter(repNew).length); } } catch (e) {} });
      all('[data-fbback]', b => b.onclick = () => { cur = ''; draw(); });
      const act = async (k, v) => { if (busy) return; busy = true; try { inbox = await run('ops_fbAct', [a.v, cur, k, v]); } catch (e) { alert(e.message); } busy = false; draw(); paintBadge((inbox || []).filter(unread).length); };
      all('[data-fbst]', b => b.onclick = () => act('st', b.dataset.fbst));
      all('[data-fbstar]', b => b.onclick = () => act('star'));
      all('[data-fbun]', b => b.onclick = async () => { await act('unread'); cur = ''; draw(); });
      all('[data-fbcp]', b => b.onclick = () => { const it = list().find(y => y.id === cur); if (!it) return; const tx = it.by + ' · ' + when(it.at) + '\n' + it.text + (it.rep || []).map(m => '\n— ' + m.by + ': ' + (m.text || '')).join(''); try { kCopy(tx); b.textContent = '✓ הועתק'; } catch (e) {} });
      all('[data-fbwa]', b => b.onclick = () => { const it = list().find(y => y.id === cur), d = String(b.dataset.fbwa).replace(/\D/g, '').replace(/^0/, '972'), tx = encodeURIComponent('שלום, לגבי הפנייה שלך במערכת: "' + String(it ? it.text : '').slice(0, 120) + '"\n');
        if (window.waOpen) window.waOpen(d, decodeURIComponent(tx)); else window.open('https:' + '/' + '/wa.me/' + d + '?text=' + tx, '_blank'); });
      if (qs('#fbNote')) { let tm = 0; qs('#fbNote').oninput = e => { clearTimeout(tm); const v = e.target.value; tm = setTimeout(async () => { try { inbox = await run('ops_fbAct', [a.v, cur, 'note', v]); } catch (er) {} }, 900); }; }
      all('[data-fbq]', b => b.onclick = () => { const t = qs('#fbRe'); t.value = (t.value ? t.value + ' ' : '') + QUICK[+b.dataset.fbq]; t.focus(); });
      all('[data-fblk]', b => b.onclick = () => { const t = qs('#fbRe'); const keep = t ? t.value : ''; showLink = !showLink; draw(); if (qs('#fbRe')) qs('#fbRe').value = keep; if (qs('#fbLk')) qs('#fbLk').focus(); });
      all('[data-fbunatt]', b => b.onclick = () => { const keep = qs('#fbRe').value; att = null; draw(); qs('#fbRe').value = keep; });
      if (qs('#fbFi')) qs('#fbFi').onchange = async e => { const f = e.target.files[0]; if (!f) return; const keep = qs('#fbRe').value, m = qs('#fbRm'); m.className = 'fbmsg'; m.textContent = 'מכין את הקובץ…';
        try { att = { name: f.name, data: await shrink(f) }; draw(); qs('#fbRe').value = keep; } catch (er) { m.className = 'fbmsg no'; m.textContent = er.message; } };
      if (qs('#fbLk')) qs('#fbLk').oninput = e => { link = e.target.value.trim(); };
      const send = async done => { const t = qs('#fbRe').value.trim(), m = qs('#fbRm'); if (!t && !att && !link) { m.className = 'fbmsg no'; m.textContent = 'נא לכתוב תשובה או לצרף משהו'; return; }
        bg.querySelectorAll('.fbcb button').forEach(y => y.disabled = true); m.className = 'fbmsg'; m.textContent = 'שולח…';
        const msg = { text: t, link: link, file: att, done: !!done };
        try { if (isO) inbox = await run('ops_fbAct', [a.v, cur, 'reply', msg]); else mine = await run('ops_fbFollow', [a.k, a.v, cur, msg]); att = null; link = ''; showLink = false; draw(); const m2 = qs('#fbRm'); if (m2) { m2.className = 'fbmsg ok'; m2.textContent = isO ? '✓ נשלח. השולח/ת יקבל/תקבל התראה ויראה את התשובה' : '✓ נשלח לד״ר גוזני'; } }
        catch (er) { m.className = 'fbmsg no'; m.textContent = er.message || 'השליחה נכשלה'; bg.querySelectorAll('.fbcb button').forEach(y => y.disabled = false); } };
      if (qs('#fbSendRe')) qs('#fbSendRe').onclick = () => send(false);
      if (qs('#fbSendDone')) qs('#fbSendDone').onclick = () => send(true);
      all('[data-fbf]', b => b.onclick = async () => { const tx = b.textContent; b.textContent = 'פותח…'; try { const f = await run('ops_fbFile', [a.k, a.v, b.dataset.fbx, b.dataset.fbf]); const w = window.open('', '_blank'); if (w) { if (/^data:image/.test(f.data)) w.document.write('<img src="' + f.data + '" style="max-width:100%">'); else w.location.href = f.data; } } catch (er) { alert(er.message); } b.textContent = tx; });
      if (qs('#fbGo')) qs('#fbGo').onclick = async () => {
        const t = qs('#fbTx').value.trim(), m = qs('#fbMsg'); if (t.length < 3) { m.className = 'fbmsg no'; m.textContent = 'נא לכתוב כמה מילים'; return; }
        const go = qs('#fbGo'); go.disabled = true; go.textContent = 'שולח…';
        let where = ''; try { where = window.FB_WHERE ? window.FB_WHERE() : ''; } catch (e) {}
        try { await run('ops_fbSend', [a.k, a.v, { type: type, text: t, where: String(where || document.title || '').slice(0, 80), dev: dev() }]); qs('#fbTx').value = ''; m.className = 'fbmsg ok'; m.textContent = '✓ תודה! ההודעה הגיעה לד״ר גוזני. התשובה תופיע ב"הפניות שלי"'; go.textContent = 'שליחה'; go.disabled = false; mine = null; if (isO) inbox = null; }
        catch (e) { m.className = 'fbmsg no'; m.textContent = e.message || 'השליחה נכשלה. נסו שוב'; go.textContent = 'שליחה'; go.disabled = false; }
      };
      if (tab === 'send' && qs('#fbTx')) setTimeout(() => { try { qs('#fbTx').focus(); } catch (e) {} }, 60);
    };
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    bg.addEventListener('keydown', e => { if (e.key === 'Escape') { if (cur) { cur = ''; draw(); } else bg.remove(); } });
    draw(); document.body.appendChild(bg); if (tab === 'in') load(); else if (!isO) run('ops_fbMine', [a.k, a.v]).then(r => { mine = r; draw(); }).catch(() => {});
  };
  // the round button, on the pages that ask for it (window.FB_FLOAT); the managers' dashboard puts its own button in the top bar
  window.fbFloat = function () {
    if (document.querySelector('.fbf') || !auth()) return;
    const b = document.createElement('button'); b.className = 'fbf'; b.type = 'button'; b.title = 'משוב ופנייה'; b.setAttribute('aria-label', 'משוב ופנייה: תקלה, הצעה או פנייה');
    b.innerHTML = '<b>💬</b><span>משוב</span>'; b.onclick = () => window.fbOpen(); document.body.appendChild(b);
  };
  const boot = () => { if (window.FB_FLOAT) { window.fbFloat(); setTimeout(window.fbFloat, 2500); }
    let tries = 0; const ask = () => { if (auth()) { window.fbBadge(); setInterval(() => { if (!document.hidden) window.fbBadge(); }, 180000); } else if (++tries < 40) setTimeout(ask, 1500); }; setTimeout(ask, 4000); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

<style>
body.kbon :is(.mbg,.sheetbg,.shbg,.crbg,.chbg,.k2bg,.nwpbg,.gdbg){bottom:var(--kb,0px)}
body.kbon :is(.mbg,.sheetbg,.shbg,.crbg,.chbg,.k2bg,.nwpbg,.gdbg)>*{max-height:calc(100% - 8px);overflow:auto}
</style>
<script>
// the on-screen keyboard (31/10/2026): on touch screens keep the focused field in view, and lift bottom sheets above the keyboard (--kb, body.kbon)
(function () {
  if (!((window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0)) return;
  const vv = window.visualViewport;
  const kb = () => { const h = vv ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0; document.documentElement.style.setProperty('--kb', h + 'px'); if (document.body) document.body.classList.toggle('kbon', h > 120); };
  if (vv) { vv.addEventListener('resize', kb); vv.addEventListener('scroll', kb); }
  const FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=file]):not([type=range]), textarea, select, [contenteditable="true"]';
  const keep = t => { const v = window.visualViewport, top = v ? v.offsetTop : 0, h = v ? v.height : innerHeight, r = t.getBoundingClientRect(); if (r.top < top + 8 || r.bottom > top + h - 8) t.scrollIntoView({ block: 'center', inline: 'nearest' }); };
  document.addEventListener('focusin', e => { const t = e.target; if (!t || !t.matches || !t.matches(FIELD)) return; setTimeout(() => keep(t), 320); setTimeout(() => { if (document.activeElement === t) keep(t); }, 700); });
  window.addEventListener('resize', () => { const t = document.activeElement; if (t && t.matches && t.matches(FIELD)) setTimeout(() => keep(t), 120); });
})();
</script>
