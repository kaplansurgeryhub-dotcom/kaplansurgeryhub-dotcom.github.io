<style>

.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font:800 16px var(--sans)}
label{display:block;font:700 14px var(--sans);margin:10px 0 5px}

.go.g{background:var(--green)}.go.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.go.r{background:#fff;color:var(--red);border:1.5px solid #E8C4BE}

.big{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin:4px 0 12px}

.pill{display:inline-block;font:800 12px var(--sans);border-radius:999px;padding:2px 9px;background:#E7F1EA;color:#2E6A47;margin-inline-start:6px}

</style>

      <details style="margin-top:10px"${S.open.cu ? ' open' : ''} data-o="cu"><summary>שאלה משלי</summary><label for="cq">השאלה</label><input id="cq" maxlength="160"><label for="co">תשובות, שורה לכל תשובה</label><textarea id="co" rows="4"></textarea><button class="go" id="cgo">פתיחת ההצבעה</button></details></div>
    <div class="card"><h3>מהקהל</h3><div class="hint">לא הבינו את השקף הזה: <b>${huhNow}</b>${huhPrev ? ' · את הקודם: <b>' + huhPrev + '</b>' : ''}</div>
      ${qs.length ? qs.map(x => `<div class="qa">${esc(x.t)}${x.show ? '<span class="pill">על המסך</span>' : ''}<div class="row"><button data-q="${x.show ? 'qhide' : 'qshow'}" data-id="${x.id}">${x.show ? 'הורדה מהמסך' : 'הצגה על המסך'}</button><button data-q="qdel" data-id="${x.id}">מחיקה</button></div></div>`).join('') : '<p class="hint">עוד אין שאלות. הקהל שולח שאלות אנונימיות מהאפליקציה.</p>'}</div>
    <div class="card"><details${S.open.nm ? ' open' : ''} data-o="nm"><summary>מי הצטרף (${v.names.length})</summary><div class="names">${v.names.map(n => `<div>${esc(n.n)} <small>${esc(({ stud: 'סטודנט/ית', int: 'סטאז׳ר/ית', res: 'מתמחה', sen: 'בכיר/ה', anon: 'אורח/ת' })[n.g] || '')}</small></div>`).join('') || '<div class="hint">עוד אף אחד</div>'}</div><p class="hint">השמות רק כאן ואצל אחראי/ת העולם. על המסך בחדר רואים רק את המספר.</p></details></div>
    <div class="card"><h3>הערה לשקף הזה</h3><input id="nt" maxlength="300" placeholder="למשל: לתקן את התרשים"><button class="go o" id="ntgo">שמירה</button><p class="hint">נשמר בסיכום ההרצאה, לשיפור המצגת.</p></div>
    <button class="go r" id="end">סיום ההרצאה</button>`;
}
async function c(op, x) { try { const r = await run('ops_hallCmd', S.key, K, op, x || {}); if (r.end) { toast('ההרצאה הסתיימה'); S.v = null; return refresh(); } S.v = r; liveView(r); } catch (e) { toast(e.message); } }
M.addEventListener('toggle', e => { const d = e.target.closest && e.target.closest('details[data-o]'); if (d) S.open[d.dataset.o] = d.open; }, true);
M.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-c],[data-q],[data-dp],[data-quick],[data-hide],#cgo,#ntgo,#end'); if (!t) return; e.preventDefault();
  if (t.dataset.go) { try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} return c('go', { d: +t.dataset.go }); }
  if (t.dataset.c) return c(t.dataset.c);
  if (t.dataset.q) return c(t.dataset.q, { id: t.dataset.id });
  if (t.dataset.dp != null && t.dataset.dp !== undefined && t.hasAttribute('data-dp')) return c('poll', { src: 'deck', i: +t.dataset.dp });
  if (t.dataset.hide) return c('word', { w: t.dataset.hide });
  if (t.dataset.quick === 'abcd') return c('poll', { q: 'מה התשובה הנכונה בשקף?', o: ['א', 'ב', 'ג', 'ד'] });
  if (t.dataset.quick === 'yn') return c('poll', { q: 'מה דעתכם?', o: ['כן', 'לא'] });
  if (t.dataset.quick === 'cloud') { const w = prompt('על מה הענן? (מילה אחת מכל אחד)', 'מה הדבר הראשון שאתם בודקים?'); if (w) c('poll', { k: 'cloud', q: w }); return; }
  if (t.id === 'cgo') return c('poll', { q: $('cq').value, o: $('co').value.split('\n') });
  if (t.id === 'ntgo') { const v = $('nt').value.trim(); if (v) c('note', { t: v }).then(() => toast('נשמר')); return; }
  if (t.id === 'end') { if (!t.dataset.arm) { t.dataset.arm = 1; t.textContent = 'לסיים? לחיצה נוספת'; setTimeout(() => { delete t.dataset.arm; t.textContent = 'סיום ההרצאה'; }, 4000); return; } return c('end'); }
});
let loopT = 0, busy = false;
async function refresh() { if (busy) return; busy = true; try { const r = await run('ops_hallRemote', S.key, K);
  if (r.none) { $('hT').textContent = 'חדר ההרצאות'; $('hS').textContent = r.me.name + ' · השלט מחובר'; if (!S.idle) { S.idle = 1; idleView(r.me); } }
  else if (r.other) { S.idle = 0; M.innerHTML = '<div class="card"><h3>בחדר מרצה ' + esc(r.other) + '</h3><p class="hint">כשההרצאה שלו תסתיים, תוכל/י להתחיל את שלך מהמחשב בחדר.</p></div>'; }
  else { S.idle = 0; const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName); if (!typing) liveView(r); S.v = r; }
} catch (e) { if (/להיכנס שוב/.test(e.message)) { S.key = ''; ls.set('hall_pk', ''); busy = false; return loginView(remoteLoop); } } busy = false; }
function remoteLoop() { $('bOff').style.display = ''; clearTimeout(loopT); const go = async () => { await refresh(); loopT = setTimeout(go, document.hidden ? 9000 : 2500); }; go(); }
$('bOff').onclick = () => { const k = S.key; S.key = ''; ls.set('hall_pk', ''); if (k) run('ops_roomOut', k).catch(() => {}); clearTimeout(loopT); $('bOff').style.display = 'none'; loginView(remoteLoop); };
if (PAIR) pairView(); else if (S.key) remoteLoop(); else loginView(remoteLoop);
window.HALLR_ = S;
})();
</script>
