<style>
/* the lecturer's phone (18/11/2026): signs the room in by its code, then it is the remote of the lecture */
:root{--navy:#1D3047;--cream:#F6F1E7;--line:#E6DED0;--gold:#C9A257;--gold2:#E2C68A;--green:#3B7F57;--ink:#1D3047;--muted:#6F6556;--red:#B5483A;--sans:Heebo,Arial,sans-serif;--serif:'Frank Ruhl Libre',Georgia,serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.hd{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:3px solid var(--gold)}
.hd b{display:block;font:800 19px var(--sans)}.hd small{display:block;font:600 13.5px var(--sans);color:var(--gold2);margin-top:2px}
.hd .x{float:left;all:unset;cursor:pointer;font:700 13px var(--sans);color:#C9D3DE;padding:4px 0 4px 2px}
main{padding:14px 16px calc(30px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}

label{display:block;font:700 14px var(--sans);margin:10px 0 5px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px;font-size:16px}

.go{all:unset;cursor:pointer;display:block;text-align:center;border-radius:14px;padding:14px;background:var(--navy);color:#fff;font:800 17px var(--sans);margin-top:12px}
.go.g{background:var(--green)}.go.o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.go.r{background:#fff;color:var(--red);border:1.5px solid #E8C4BE}

.er{color:var(--red);font:700 14px var(--sans);min-height:20px;margin-top:8px}
.big{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin:4px 0 12px}

.meta{display:flex;justify-content:space-between;align-items:center;font:600 14px var(--sans);color:var(--muted);margin-bottom:10px}
.meta b{font:600 24px var(--mono);color:var(--ink);direction:ltr}.meta .warn{color:var(--red)}
.ln{background:#FFF7E6;border:1.5px solid #EFD9A8;border-radius:16px;padding:12px 14px;font:500 15px/1.5 var(--sans)}

.row{display:flex;gap:8px;flex-wrap:wrap}.row button{all:unset;cursor:pointer;flex:1;min-width:30%;text-align:center;padding:12px 6px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font:700 14.5px var(--sans)}

.hint{font:500 13.5px/1.5 var(--sans);color:var(--muted)}

.lk.off{background:#FBF3E6;color:#7A5B21;border-color:#ECD9B4}.lk.off i{background:#C9A257;box-shadow:none}.lk.off small{color:#8D7444}

.wb{position:sticky;top:var(--hdh,64px);z-index:4;display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:8px 16px;background:var(--cream);scrollbar-width:none}.wb::-webkit-scrollbar{display:none}

.it.hot{background:#FBF3E6;margin:0 -10px;padding:11px 10px;border-radius:12px}
.srch{margin-bottom:6px}
.scr{display:flex;gap:8px;margin-top:4px}.scr button{all:unset;cursor:pointer;flex:1;text-align:center;font:800 13.5px var(--sans);padding:10px;border-radius:12px;background:#F1ECE1}
