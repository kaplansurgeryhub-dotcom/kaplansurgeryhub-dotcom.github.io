<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Boss TV</title>
<meta name="description" content="המערך היום במסך אחד">
<meta name="application-name" content="Boss TV">
<meta name="apple-mobile-web-app-title" content="Boss TV">
<meta name="theme-color" content="#0B1A29">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#06171E;color:#E8F2EF;font-family:Heebo,Arial,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block}
.cover{position:fixed;inset:0;z-index:5;cursor:pointer;background:transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3vh}
.cover span{background:rgba(6,23,30,.82);border:1px solid rgba(169,230,201,.3);color:#A9E6C9;border-radius:99px;padding:10px 22px;font-size:18px;transition:opacity .8s}
.none{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(60% 60% at 50% 0%,#0E3A44,#06171E 70%)}
.none img{width:120px;height:120px}
.none b{display:block;font-size:30px;margin:18px 0 8px}
.none p{margin:0;color:#86A6A8;font-size:18px;line-height:1.6}
[hidden]{display:none!important}
</style>
</head>
<body>
<iframe id="tv" title="Boss TV" hidden></iframe>
<div class="cover" id="cover" hidden><span>לחיצה אחת או מקש · מסך מלא</span></div>
<div class="none" id="none" hidden><div><img src="icon-192.png" alt=""><b>Boss TV</b><p>המסך עוד לא מוגדר במחשב הזה.<br>פותחים פעם אחת את הקישור האישי של המסך, ומשם הוא נפתח לבד.</p></div></div>
<script>
// Boss TV: the department head's TV screen, a separate app with its own icon. The screen itself runs in Kaplan Ops (?tv=<key>);
// this page keeps the screen's key on this computer, keeps the display awake, offers full screen and reloads the screen once a night.
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwTfpoil9lWq372tN0cw8tndmPNp2o3q2SHFYN1ZDMYSRdO222LdOoSZGD5rB-Nu_w2GQ/exec';
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search).get('k') || '', k = '';
  try { if (/^[a-f0-9]{64}$/.test(q)) localStorage.setItem('tv_k', q); k = localStorage.getItem('tv_k') || ''; } catch (e) { k = /^[a-f0-9]{64}$/.test(q) ? q : ''; }
  // the key stays on this computer, not in the address bar
  if (q) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (!k) { $('none').hidden = false; return; }
  var f = $('tv'), start = function () { f.src = EXEC + '?tv=' + k; };
  f.hidden = false; start();
  // reload the screen once a night (around 04:00), so a new version and a new day always come in
  var day = new Date().toDateString();
  setInterval(function () { var d = new Date(); if (d.toDateString() !== day && d.getHours() >= 4) { day = d.toDateString(); start(); } }, 5 * 60e3);
  // keep the display awake while the screen is shown
  var lock = null, wake = function () { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { lock = l; }, function () {}); } catch (e) {} };
  wake(); document.addEventListener('visibilitychange', wake);
  // full screen on its own (11/11/2026, Dr. Gozani): the Mac app opens Chrome already full screen; otherwise the first click or key
  // anywhere on the screen makes it full screen, and again whenever it leaves full screen. The screen is read only, so nothing is lost
  var full = function () { return !!document.fullscreenElement || (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches) || (screen.height - innerHeight < 4 && screen.width - innerWidth < 4); };
  var go = function () { if (full() || !document.documentElement.requestFullscreen) return; document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(function () { $('cover').hidden = true; }, function () {}); wake(); };
  var arm = function () { if (full() || !document.documentElement.requestFullscreen) { $('cover').hidden = true; return; } $('cover').hidden = false; var s = $('cover').querySelector('span'); if (s) { s.style.opacity = '1'; clearTimeout(arm.t); arm.t = setTimeout(function () { s.style.opacity = '0'; }, 15000); } };
  $('cover').onclick = go; document.addEventListener('keydown', go);
  document.addEventListener('fullscreenchange', function () { setTimeout(arm, 300); });
  window.addEventListener('resize', function () { setTimeout(arm, 300); });
  go(); setTimeout(arm, 800);
})();
</script>
</body>
</html>
