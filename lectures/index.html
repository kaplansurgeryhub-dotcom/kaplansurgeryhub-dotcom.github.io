<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פורטל האקדמיה · Kaplan Surgical Academy</title>
<meta name="description" content="פורטל האקדמיה של המערך הכירורגי · המרכז הרפואי קפלן: עולם הלימוד של המערך, המתמחים, הסטאז׳רים והסטודנטים">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C2A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="פורטל האקדמיה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C2A35;--navy2:#164B54;--g:#00967D;--g2:#3DC08C;--g3:#0A6B5A;--g4:#6FD3A8;--bg:#EDF2F0;--line:#D6E2DE;--ink:#14252B;--muted:#55696E;--serif:'Frank Ruhl Libre',Georgia,serif;--sans:Heebo,system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--focus:0 0 0 4px #fff,0 0 0 8px var(--g2)}
*{box-sizing:border-box}
html{font-size:clamp(15px,calc(.55vw + 8.4px),22px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font-family:var(--mono);font-size:.85em;border:1px solid rgba(255,255,255,.3);border-bottom-width:2px;border-radius:6px;padding:0 .4em;background:rgba(255,255,255,.06)}

/* ---------- landing ---------- */
#home{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;color:#fff;background:radial-gradient(110% 90% at 50% 0%,#1B5A62 0%,#0F3843 42%,#0A222B 100%);display:flex;flex-direction:column;align-items:center;padding:calc(clamp(1.2rem,4vh,3rem) + env(safe-area-inset-top)) 16px calc(1rem + env(safe-area-inset-bottom))}
.art{position:absolute;pointer-events:none;opacity:.13}
.art.a1{inset:-4% auto -4% -6%;width:36%;background:url(../ops/art/organs.webp) no-repeat center top/cover}
.art.a2{inset:-4% -6% -4% auto;width:36%;background:url(../ops/art/heart.webp) no-repeat center top/cover;opacity:.1}
.art.a3{inset:auto 0 -12% 0;height:40%;background:url(../ops/art/instr.webp) no-repeat center bottom/contain;opacity:.05}
#home::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(60% 60% at 50% 30%,#000,transparent 80%);mask-image:radial-gradient(60% 60% at 50% 30%,#000,transparent 80%);pointer-events:none}
#home::after{content:'';position:absolute;inset:0;background:radial-gradient(55% 45% at 50% 26%,rgba(61,192,140,.18),transparent 70%);pointer-events:none}
.clock{position:absolute;z-index:2;top:calc(clamp(1rem,3vh,2.2rem) + env(safe-area-inset-top));left:clamp(1rem,2.4vw,3rem);text-align:left;direction:ltr;animation:up .8s .2s both}
.clock b{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(2rem,3.4vw,4rem);line-height:1;letter-spacing:.02em;color:#fff}
.clock span{display:block;margin-top:.35rem;font-weight:700;font-size:clamp(.9rem,1.05vw,1.25rem);color:#A9D9C8;direction:rtl;text-align:left}
.brand{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.emb{position:relative;width:clamp(96px,min(13vw,17vh),220px);aspect-ratio:1;border-radius:50%;animation:pop .9s cubic-bezier(.2,.9,.25,1.2) both}
.emb img{width:100%;height:100%;border-radius:50%;display:block;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.45)}
.emb::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(111,211,168,.55);animation:ring 3.2s ease-out infinite}
.emb::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--g2);box-shadow:0 0 34px rgba(61,192,140,.45)}
.ttl{font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(.85rem,1.1vw,1.25rem);color:var(--g4);margin:clamp(.9rem,2.4vh,1.6rem) 0 0;direction:ltr;animation:up .8s .25s both}
.hh{margin:.1em 0 .12em;font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,min(5vw,8.4vh),6rem);line-height:1.02;animation:up .8s .32s both;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.sub{font-size:clamp(1.05rem,min(1.7vw,2.9vh),1.9rem);font-weight:700;color:#CDE8DE;animation:up .8s .4s both}
.sub i{font-style:normal;color:var(--g2);margin:0 .55em}
.choose{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,28px);width:min(1680px,100%);margin-top:clamp(1.2rem,4.5vh,3.4rem)}
.pick{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;min-height:clamp(220px,34vh,400px);padding:clamp(1.1rem,1.8vw,2.2rem);border-radius:30px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;animation:up .8s both;outline:none}
.pick:nth-child(1){animation-delay:.55s}.pick:nth-child(2){animation-delay:.63s}.pick:nth-child(3){animation-delay:.71s}.pick:nth-child(4){animation-delay:.79s}
.pick::before{content:'';position:absolute;inset:0;background:var(--art) no-repeat 0% 20%/auto 150%;opacity:.15;pointer-events:none;transition:opacity .3s}
.pick:hover,.pick:focus-visible{transform:translateY(-6px);border-color:var(--g2);background:linear-gradient(160deg,rgba(61,192,140,.26),rgba(255,255,255,.05));box-shadow:0 26px 70px rgba(0,0,0,.4),0 0 0 4px var(--g2)}
.pick:hover::before,.pick:focus-visible::before{opacity:.26}
.pick .pi{position:relative;flex:none;width:clamp(64px,min(6vw,10vh),118px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--g),var(--g3));box-shadow:0 0 0 6px rgba(61,192,140,.18),0 12px 30px rgba(0,0,0,.3);margin-bottom:auto}
.pick .pi svg{width:54%;height:54%}
.pick small{position:relative;display:block;margin-top:1rem;font-weight:800;letter-spacing:.14em;color:var(--g4);font-size:clamp(.78rem,.85vw,1rem);direction:ltr}
.pick h2{position:relative;margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(2rem,min(3vw,5.4vh),3.6rem);line-height:1.05}
.pick p{position:relative;margin:.15rem 0 0;color:#CADDDC;font-size:clamp(.95rem,1.05vw,1.25rem);line-height:1.45;font-weight:500}
.pick .badge{position:relative;margin-top:.6rem}
.pick .num{position:absolute;top:1rem;left:1.2rem;font-family:var(--mono);font-weight:600;font-size:1rem;width:2.1em;height:2.1em;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.25);color:#CFE6DF}
.pick .go{position:absolute;bottom:1.1rem;left:1.3rem;font-size:1.8rem;opacity:.45;transition:transform .2s,opacity .2s}
.pick:hover .go,.pick:focus-visible .go{transform:translateX(-6px);opacity:1}
.hall{position:relative;margin-top:.7rem;display:inline-flex;align-items:center;gap:.45em;border-radius:999px;padding:.22em .95em;font-weight:700;font-size:clamp(.8rem,.85vw,1rem);color:#CFE6DF;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);animation:up .8s .45s both}
.hall::before{content:'';width:.5em;height:.5em;border-radius:50%;background:var(--g2)}
.wch{position:relative;display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.wch i{font-style:normal;font-weight:700;font-size:clamp(.78rem,.82vw,1rem);padding:.2em .7em;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#E4F1EE;white-space:nowrap}
.hero .wch{margin-top:1rem}
.pick h2{font-size:clamp(1.7rem,min(2.3vw,4.6vh),3rem);white-space:nowrap}
.pick .pi{width:clamp(56px,min(5vw,8.5vh),104px)}
.pick small{margin-top:.7rem}
.badge{display:inline-flex;align-items:center;gap:.4em;border-radius:999px;padding:.24em .95em;font-weight:800;font-size:.92rem;background:rgba(61,192,140,.2);color:#C4F3DD;border:1px solid rgba(61,192,140,.45)}
.badge.mute{background:rgba(255,255,255,.08);color:#D6E4E6;border-color:rgba(255,255,255,.24)}
.foot{position:relative;z-index:1;margin-top:auto;padding-top:clamp(1rem,3vh,2rem);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.8rem 1.6rem;color:#9DBCBE;font-size:.92rem;animation:up .8s 1s both}
.foot .logos{display:inline-flex;align-items:center;gap:1rem;background:#fff;border-radius:14px;padding:.4rem .9rem}
.foot img{height:2.1rem;display:block}
.foot .keys kbd{margin:0 .15em}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.96);opacity:.9}100%{transform:scale(1.22);opacity:0}}

/* ---------- inner pages ---------- */
.bar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0C2A35,#0F3540);color:#fff;padding:calc(.6rem + env(safe-area-inset-top)) 16px .6rem;box-shadow:0 6px 24px rgba(12,42,53,.25)}
.bar .in{max-width:1760px;margin:0 auto;display:flex;align-items:center;gap:1rem;min-width:0}
.home{flex:none;display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;color:#fff;border-radius:999px;padding:.3rem .9rem .3rem .4rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);min-height:3rem;font-weight:800;outline:none}
.home:hover,.home:focus-visible{border-color:var(--g2);background:rgba(61,192,140,.18)}
.home:focus-visible{box-shadow:0 0 0 3px var(--g2)}
.home img{width:2.4rem;height:2.4rem;border-radius:50%;background:#fff}
.crumbs{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1;font-weight:800;overflow:hidden}
.crumbs a,.crumbs b{white-space:nowrap;text-decoration:none;border-radius:999px;padding:.25rem .7rem;outline:none}
.crumbs a{color:#BFDCD3;font-size:1.05rem}
.crumbs a:hover,.crumbs a:focus-visible{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 0 0 2px var(--g2)}
.crumbs b{font-family:var(--serif);font-weight:900;font-size:clamp(1.3rem,1.7vw,1.9rem);overflow:hidden;text-overflow:ellipsis;padding-inline:.3rem}
.crumbs i{font-style:normal;color:var(--g2);opacity:.8}
.bclock{flex:none;text-align:left;direction:ltr;line-height:1.1}
.bclock b{display:block;font-family:var(--mono);font-weight:600;font-size:1.45rem}
.bclock span{display:block;font-size:.8rem;font-weight:700;color:#9FC6BB;direction:rtl;text-align:left}

.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 85% 0%,#164B54 0%,#0C2A35 65%);color:#fff;padding:2rem 16px 4.2rem}
.hero::after{content:'';position:absolute;inset:-10% -2% -10% auto;width:46%;background:var(--art,url(../ops/art/gi.webp)) no-repeat center 20%/cover;opacity:.13;pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1760px;margin:0 auto}
.hero .kick{font-weight:800;color:var(--g4);letter-spacing:.14em;font-size:.95rem;direction:ltr;text-align:right}
.hero h2{margin:.15rem 0 .45rem;font-family:var(--serif);font-weight:900;font-size:clamp(2.2rem,3.6vw,4rem);line-height:1.06}
.hero p{margin:0;max-width:64rem;color:#C9D9DB;font-size:1.15rem;line-height:1.55}
.stats{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
.stats span{display:inline-flex;align-items:baseline;gap:.35em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:.35em 1em;font-weight:700;color:#D7E7E6}
.stats b{font-size:1.35rem;color:#fff;font-family:var(--serif)}
main.wrap{position:relative;max-width:1760px;margin:-2.6rem auto 3rem;padding:0 16px}

/* section tiles (audience page) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:clamp(14px,1.4vw,26px)}
.stile{--c:#00967D;position:relative;display:flex;flex-direction:column;min-height:clamp(17rem,40vh,26rem);border-radius:28px;overflow:hidden;background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit;box-shadow:0 12px 34px rgba(12,42,53,.10);transition:transform .2s,box-shadow .2s,border-color .2s;outline:none}
.stile:hover,.stile:focus-visible{transform:translateY(-5px);border-color:var(--c);box-shadow:0 26px 60px rgba(12,42,53,.22)}
.stile:focus-visible{box-shadow:var(--focus),0 26px 60px rgba(12,42,53,.22)}
.st-cv{position:relative;flex:none;height:clamp(8rem,17vh,12rem);overflow:hidden;isolation:isolate;color:#fff;background:radial-gradient(75% 120% at 16% 50%,color-mix(in srgb,var(--c) 66%,transparent),transparent 66%),linear-gradient(158deg,#0C2A35 0%,#0E3340 52%,color-mix(in srgb,var(--c) 45%,#0A222B) 100%)}
.st-cv::before{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px;-webkit-mask-image:radial-gradient(80% 100% at 18% 50%,#000 10%,transparent 75%);mask-image:radial-gradient(80% 100% at 18% 50%,#000 10%,transparent 75%)}
.st-cv .dk-ct{position:absolute;left:-4%;top:50%;width:46%;aspect-ratio:1;transform:translateY(-50%);fill:none;stroke:rgba(255,255,255,.09);stroke-width:.5;z-index:-1}
.st-il{position:absolute;left:7%;top:50%;height:76%;aspect-ratio:1;transform:translateY(-50%);fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;--hl:color-mix(in srgb,var(--c) 40%,#fff);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 70%,transparent));transition:transform .35s}
.stile:hover .st-il,.stile:focus-visible .st-il{transform:translateY(-50%) scale(1.07)}
.st-cv small{position:absolute;top:1rem;right:1.2rem;font-weight:800;letter-spacing:.14em;font-size:.82rem;color:rgba(255,255,255,.85);direction:ltr}
.st-cv .num{position:absolute;bottom:1rem;right:1.2rem;font-family:var(--mono);font-weight:600;width:2.2em;height:2.2em;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.st-b{flex:1;display:flex;flex-direction:column;gap:.4rem;padding:1.2rem 1.4rem 1.3rem}
.st-b b{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,2vw,2.3rem);line-height:1.12;color:var(--navy)}
.st-b>span{color:var(--muted);font-size:1.08rem;line-height:1.45;font-weight:500}
.st-f{margin-top:auto;padding-top:.6rem;display:flex;align-items:center;gap:.6rem}
.st-f .cnt{font-weight:800;color:var(--g3);background:#E4F4ED;border-radius:999px;padding:.3em .95em}
.st-f .cnt.soon{background:#EEF2F3;color:#5A6E73;border:1px dashed #BFCFD0}
.st-f .cnt.lnk{background:#EAF1F8;color:#2C5E8E}
.st-f .go{margin-inline-start:auto;font-size:1.6rem;color:var(--c);transition:transform .2s}
.stile:hover .st-f .go,.stile:focus-visible .st-f .go{transform:translateX(-6px)}

/* section content */
#main .dk-card{outline:none}
.dk-card:focus-visible{box-shadow:var(--focus),0 18px 40px rgba(12,42,53,.16)!important}
.dk-jump a:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.soonrow{display:flex;align-items:center;gap:1rem;border:2px dashed #C9D9D4;border-radius:20px;padding:1.2rem 1.3rem;background:#F7FAF9;color:var(--muted);font-weight:600;font-size:1.05rem}
.soonrow .sb{flex:none;border-radius:999px;padding:.25em 1em;font-weight:900;background:var(--navy);color:var(--g4)}
.empty{text-align:center;padding:2.6rem 1rem 1.4rem;color:var(--muted)}
.empty .eic{width:7rem;height:7rem;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#E3F3EC,#CFE9DF);color:var(--g3)}
.empty .eic svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;--hl:var(--g)}
.empty h3{margin:0 0 .4rem;font-family:var(--serif);font-weight:900;color:var(--navy);font-size:clamp(1.8rem,2.6vw,2.6rem)}
.empty p{margin:0 auto;max-width:46rem;font-size:1.15rem;line-height:1.6}
.soonbadge{display:inline-block;margin-bottom:.8rem;border-radius:999px;padding:.3em 1.1em;font-weight:900;background:var(--navy);color:var(--g4);letter-spacing:.04em}
.ghost{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1rem;margin-top:1.6rem;text-align:right}
.ghost>div{border:2px dashed #C9D9D4;border-radius:20px;padding:1.2rem;display:flex;align-items:center;gap:1rem;background:#F7FAF9}
.ghost svg{flex:none;width:3.2rem;height:3.2rem;fill:none;stroke:#7FA79B;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;--hl:var(--g)}
.ghost b{display:block;color:var(--navy);font-size:1.18rem}
.ghost small{display:block;color:var(--muted);font-weight:600;font-size:.95rem}
.ghost i{font-style:normal;display:inline-block;margin-top:.3rem;font-size:.8rem;font-weight:800;color:#6C8388;border:1px solid #C9D9D4;border-radius:999px;padding:.05em .7em}
.note{display:flex;align-items:center;gap:.7rem;margin:0 0 1rem;padding:.8rem 1.1rem;border-radius:16px;background:#EAF4FB;color:#24557F;font-weight:700;font-size:1rem}
.note.priv{margin:1.4rem 0 0;background:#E6F4EF;color:#0A5C4C}.note.priv::before{background:#0A6B5A}
.note::before{content:'i';flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:#2C6E9E;color:#fff;font-family:var(--serif);font-weight:900}
.topics{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:.8rem}
.topics li{display:flex;align-items:flex-start;gap:.9rem;border:1px solid var(--line);border-radius:18px;padding:.9rem 1rem;background:#fff}
.topics li>i{flex:none;font-style:normal;font-family:var(--mono);font-weight:600;width:2.3em;height:2.3em;display:grid;place-items:center;border-radius:12px;background:#EAF1F8;color:#2C5E8E}
.topics li b{display:block;color:var(--navy);font-size:1.12rem;line-height:1.3}
.topics li small{display:inline-block;margin-top:.3rem;font-weight:800;font-size:.82rem;color:#6C8388;border:1px dashed #C4D4CF;border-radius:999px;padding:.05em .75em}
.topics li .lk{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.topics li .lk a{font-weight:800;font-size:.92rem;color:var(--g3);background:#E4F4ED;border-radius:999px;padding:.2em .8em;text-decoration:none;outline:none}
.topics li .lk a:focus-visible{box-shadow:0 0 0 3px var(--g2)}
.dk-kd.pdf{background:#FBEDEF;color:#9A3446}.dk-kd.page{background:#E6F2F9;color:#24678E}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;z-index:100;outline:none;background:#0A1E25;display:flex;flex-direction:column}
#viewer iframe{flex:1;width:100%;border:0;background:#fff}
#pdfv{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(80% 80% at 50% 40%,#13323C,#081A20);touch-action:pan-y pinch-zoom;cursor:default}
#pdfv canvas{display:block;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pz{position:absolute;top:0;bottom:0;width:30%;z-index:1;cursor:pointer;background:transparent;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}.pz:focus{outline:none}
.pz.nx{left:0}.pz.pv{right:0}
.pnav{position:absolute;bottom:calc(1rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:.5rem;transition:opacity .4s}
.pnav button{width:3.4rem;height:3.4rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(12,42,53,.85);color:#fff;font-size:1.5rem;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pnav button:hover,.pnav button:focus-visible{background:var(--g);outline:none}
.pnav button[disabled]{opacity:.35;cursor:default}
.pnav span{min-width:6.5rem;text-align:center;font-family:var(--mono);font-weight:600;font-size:1.15rem;color:#fff;background:rgba(12,42,53,.85);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.55rem 1rem;direction:ltr}
.pbar{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:3;background:rgba(255,255,255,.08)}
.pbar i{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .25s}
.vbar{position:absolute;top:calc(.7rem + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:.45rem;transition:opacity .4s}
#viewer.idle .vbar,#viewer.idle .pnav{opacity:0}
#viewer.idle .vbar:hover,#viewer.idle .vbar:focus-within,#viewer.idle .pnav:hover,#viewer.idle .pnav:focus-within{opacity:1}
.vbar button,.vbar a{display:inline-flex;align-items:center;gap:.4em;white-space:nowrap;min-height:2.9rem;padding:0 1rem;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(12,42,53,.85);color:#fff;font-weight:800;font-size:.98rem;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.vbar button:hover,.vbar a:hover,.vbar button:focus-visible,.vbar a:focus-visible{background:var(--g);outline:none}
.vbar svg{width:1.15em;height:1.15em}
.vload{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#BFE3D6;font-weight:800;font-size:1.3rem;pointer-events:none;transition:opacity .3s;text-align:center}
.vload i{display:block;width:3.4rem;height:3.4rem;margin:0 auto 1rem;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--g2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1180px){
  .choose{grid-template-columns:1fr 1fr}
  .pick{min-height:clamp(180px,26vh,300px)}
}
@media (max-width:900px),(max-height:500px) and (max-width:1000px){
  .clock{position:relative;top:auto;left:auto;text-align:center;margin-bottom:1rem}
  .clock span{text-align:center}
  .art.a1,.art.a2{width:70%;opacity:.08}
  .bclock{display:none}
  .crumbs a.mid{display:none}
  .crumbs i.mid{display:none}
  .home{padding:.25rem .5rem .25rem .3rem}
  .home .lbl{display:none}
  .hero{padding:1.4rem 16px 3.6rem}
  .hero::after{width:80%;opacity:.08}
  .foot .keys{display:none}
  .vbar .vt{display:none}
  .vbar{left:.6rem;transform:none;top:calc(.6rem + env(safe-area-inset-top));flex-direction:column}
  .vbar button,.vbar a{padding:0;width:2.9rem;justify-content:center}
  .pz{width:22%}
}
@media (max-width:640px){
  .choose{grid-template-columns:1fr}
  .pick{min-height:0;flex-direction:row;align-items:center;gap:1rem;padding:1rem 1.1rem;border-radius:22px}
  .pick .pi{margin:0;width:64px}
  .pick .pt{min-width:0}
  .pick small{margin:0}
  .pick .num,.pick .go{display:none}
  .pick p{font-size:.95rem}
  .pick h2{white-space:normal;font-size:1.75rem}
  .stile{min-height:0;border-radius:22px}
  .st-cv{height:7rem}
  .st-b{padding:1rem 1.1rem}
  .soonrow{flex-direction:column;align-items:flex-start;gap:.5rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<style id="dk-css">

        : '<div class="soonrow"><span class="sb">בקרוב</span>החומר של ' + esc(g.t || s.t) + ' יעלה לכאן בהדרגה.</div>';

}
function decksPage(a, s){
  shell('decks'); crumbs(a, s);
  document.title = s.t + ' · ' + a.t + ' · פורטל האקדמיה';
  setHero('SCRUB IN', 'מצגות הסבב בכירורגיה', 'כל המצגות של סבב הסטודנטים במערך. בוחרים מצגת והיא נפתחת על כל המסך. מעבר בין שקפים בחצים, בשלט או בהחלקה.',
    '<span><b>' + B.total + '</b> מצגות</span><span><b>' + B.weeks + '</b> שבועות</span><span><b>8</b> תחומים</span><span><b>' + B.topics + '</b> נושאים</span><span><b>' + B.chapters + '</b> פרקים בסאביסטון</span>', a.art);
}

// ---------- viewer ----------
var V = document.getElementById('viewer'), F = document.getElementById('frame'), PV = document.getElementById('pdfv'), openItem = null, closeTo = '', weFull = false, idleT = 0;
function isFull(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function goFull(){ var e = document.documentElement, r = e.requestFullscreen || e.webkitRequestFullscreen; if(r && !isFull()){ try { var p = r.call(e); weFull = true; if(p && p.catch) p.catch(function(){ weFull = false; }); } catch(x){ weFull = false; } } }
function exitFull(){ var x = document.exitFullscreen || document.webkitExitFullscreen; if(x && isFull()){ try { var p = x.call(document); if(p && p.catch) p.catch(function(){}); } catch(e){} } weFull = false; }
function syncFullBtn(){ document.getElementById('vFullT').textContent = isFull() ? 'יציאה ממסך מלא' : 'מסך מלא'; }
function loading(on, t){ var l = document.getElementById('vload'); l.style.opacity = on ? 1 : 0; if(t) document.getElementById('vloadT').textContent = t; }
function openView(it, back){
  closeTo = back;
  if(openItem && openItem.url === it.url && !V.classList.contains('hide')) return;
  openItem = it;
  document.getElementById('vTab').href = it.url;
  V.classList.remove('hide'); document.body.style.overflow = 'hidden';
  document.title = it.t + ' · פורטל האקדמיה';
  if(it.type === 'pdf'){ F.classList.add('hide'); F.src = 'about:blank'; PV.classList.remove('hide'); try { F.blur(); } catch(e){} V.focus({preventScroll: true}); pdfOpen(it.url); }
  else { PV.classList.add('hide'); F.classList.remove('hide'); loading(true, it.type === 'page' ? 'טוען…' : 'טוען את המצגת…'); F.src = it.url; }
  poke(); syncFullBtn();
}
function closeView(){
  if(V.classList.contains('hide')) return;
  V.classList.add('hide'); F.src = 'about:blank'; openItem = null; pdfClose();
  document.body.style.overflow = '';
  if(weFull) exitFull();
}
function leave(){ location.hash = closeTo || ''; }
F.addEventListener('load', function(){
  if(F.src === 'about:blank' || F.classList.contains('hide')) return;
  loading(false);
  try {
    var cd = F.contentDocument;
    if(cd && !cd.__lh){ cd.__lh = 1;
      ['mousemove','touchstart','pointerdown','wheel'].forEach(function(ev){ cd.addEventListener(ev, poke, {passive:true}); });
      cd.addEventListener('keydown', function(e){ poke(); if(e.key === 'Escape' && !isFull()) leave(); });
    }
    F.contentWindow.focus();
  } catch(e){}
});
function poke(){ V.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ V.classList.add('idle'); }, 2600); }
V.addEventListener('mousemove', poke); V.addEventListener('touchstart', poke, {passive:true});
document.getElementById('vClose').onclick = leave;
document.getElementById('vFull').onclick = function(){ if(isFull()) exitFull(); else goFull(); setTimeout(syncFullBtn, 300); try { if(!F.classList.contains('hide')) F.contentWindow.focus(); } catch(e){} };
document.addEventListener('fullscreenchange', function(){ syncFullBtn(); if(openItem && openItem.type === 'pdf') setTimeout(pdfDraw, 120); });
document.addEventListener('webkitfullscreenchange', syncFullBtn);

// ---------- PDF: one page at a time, fitted to the screen (pdf.js from cdnjs; the browser's own viewer as a fallback) ----------
var PD = {doc: null, n: 1, url: '', task: null, tok: 0};
var pdfLib = null;
function loadPdfJs(cb){
  if(window.pdfjsLib) return cb(window.pdfjsLib);
  if(pdfLib === false) return cb(null);
  var s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
  s.onload = function(){ try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; cb(window.pdfjsLib); } catch(e){ pdfLib = false; cb(null); } };
  s.onerror = function(){ pdfLib = false; cb(null); };
  document.head.appendChild(s);
}
function pdfOpen(url){
  var tok = ++PD.tok; PD.url = url; PD.doc = null; PD.n = 1;
  PV.querySelectorAll('canvas').forEach(function(c){ c.remove(); });
  loading(true, 'טוען את הקובץ…');
  loadPdfJs(function(lib){
    if(tok !== PD.tok) return;
    if(!lib) return pdfNative(url);
    var t = lib.getDocument({url: url, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/'});
    t.onProgress = function(p){ if(tok === PD.tok && p.total) document.getElementById('vloadT').textContent = 'טוען את הקובץ… ' + Math.round(100 * p.loaded / p.total) + '%'; };
    t.promise.then(function(doc){ if(tok !== PD.tok) return; PD.doc = doc; pdfGo(1); }, function(){ if(tok === PD.tok) pdfNative(url); });
  });
}
function pdfNative(url){ PV.classList.add('hide'); F.classList.remove('hide'); F.src = url; }
function pdfClose(){ PD.tok++; if(PD.doc){ try { PD.doc.destroy(); } catch(e){} } PD.doc = null; PV.querySelectorAll('canvas').forEach(function(c){ c.remove(); }); }
function pdfGo(n){
  if(!PD.doc) return;
  n = Math.max(1, Math.min(PD.doc.numPages, n)); PD.n = n;
  document.getElementById('pNum').textContent = n + ' / ' + PD.doc.numPages;
  document.getElementById('pPrev').disabled = n <= 1; document.getElementById('pNext').disabled = n >= PD.doc.numPages;
  document.getElementById('pBar').style.width = (100 * n / PD.doc.numPages) + '%';
  pdfDraw();
}
function pdfDraw(){
  if(!PD.doc) return;
  var tok = PD.tok, n = PD.n;
  PD.doc.getPage(n).then(function(pg){
    if(tok !== PD.tok || n !== PD.n) return;
    var v1 = pg.getViewport({scale: 1}), W = PV.clientWidth - 24, H = PV.clientHeight - 24;
    var sc = Math.max(.1, Math.min(W / v1.width, H / v1.height)), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    var vp = pg.getViewport({scale: sc * dpr}), c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(v1.width * sc) + 'px'; c.style.height = Math.floor(v1.height * sc) + 'px';
    if(PD.task){ try { PD.task.cancel(); } catch(e){} }
    PD.task = pg.render({canvasContext: c.getContext('2d'), viewport: vp});
    PD.task.promise.then(function(){
      if(tok !== PD.tok || n !== PD.n) return;
      PV.querySelectorAll('canvas').forEach(function(o){ o.remove(); });
      PV.insertBefore(c, PV.firstChild); loading(false);
      if(n < PD.doc.numPages) PD.doc.getPage(n + 1);
    }, function(){});
  });
}
document.getElementById('pNext').onclick = function(){ pdfGo(PD.n + 1); poke(); };
document.getElementById('pPrev').onclick = function(){ pdfGo(PD.n - 1); poke(); };
document.getElementById('pzN').onclick = function(){ pdfGo(PD.n + 1); poke(); };
document.getElementById('pzP').onclick = function(){ pdfGo(PD.n - 1); poke(); };
(function(){ var x0 = null, y0 = 0;
  PV.addEventListener('touchstart', function(e){ if(e.touches.length === 1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, {passive:true});
  PV.addEventListener('touchend', function(e){ if(x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) pdfGo(PD.n + (dx > 0 ? 1 : -1)); }, {passive:true});
})();
var rzT = 0; window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(function(){ if(openItem && openItem.type === 'pdf') pdfDraw(); }, 150); });

// ---------- routing ----------
// #            landing
// #i           an audience (s students, i interns, r residents, m department)
// #i/seminars  a section;  #i/seminars/sem1  an item open on the whole screen
// #s/decks[?filters][/deck.html]  the student deck browser (old links #s?…, #s/deck.html still work)
function route(){
  var raw = location.hash.replace(/^#/, ''), qi = raw.indexOf('?'), path = qi < 0 ? raw : raw.slice(0, qi), q = qi < 0 ? null : raw.slice(qi + 1);
  try { path = decodeURIComponent(path); } catch(e){}
  var p = path.split('/').filter(Boolean);
  if(p[0] === 'l'){ location.replace('#m'); return; }
  var a = A[p[0]];
  if(!a){ closeView(); if(shown !== 'home'){ shell('home'); document.title = 'פורטל האקדמיה · Kaplan Surgical Academy'; window.scrollTo(0, 0); } shown = 'home'; return; }
  if(a.key === 's' && p[1] !== 'decks' && (q !== null || /\.html$/.test(p[1]||'') || /^(rot|dis|top)$/.test(p[1]||''))) p = ['s', 'decks'].concat(p.slice(1));
  var s = null; (a.sections||[]).forEach(function(x){ if(x.id === p[1] && x.type !== 'link') s = x; });
  if(!s){ closeView(); if(shown !== 'a:' + a.key){ audPage(a); window.scrollTo(0, 0); } shown = 'a:' + a.key; return; }
  var key = 's:' + a.key + '/' + s.id;
  if(s.type === 'decks'){
    var file = '';
    p.slice(2).forEach(function(x){ if(/^(rot|dis|top)$/.test(x)){ if(!/(^|&)v=/.test(q || '')) q = [x === 'rot' ? '' : 'v=' + x, q || ''].filter(Boolean).join('&'); } else if(/\.html$/.test(x)) file = x; });
    if(shown !== key){ decksPage(a, s); window.scrollTo(0, 0); lastQ = null; }
    shown = key;
    if(q !== lastQ || lastQ === null){ B.load(q); lastQ = q; }
    if(file && B.has(file)){ var bq = B.query(); openView(normItem({deck: file}), 's/decks' + (bq ? '?' + bq : '')); }
    else { closeView(); var cq = B.query(); try { history.replaceState(null, '', '#s/decks' + (cq ? '?' + cq : '')); } catch(e){} lastQ = cq; }
    return;
  }
  if(shown !== key){ secPage(a, s); window.scrollTo(0, 0); }
  shown = key;
  var it = null; if(p[2]) s.all.forEach(function(x){ if(x.id === p[2]) it = x; });
  if(it && it.type !== 'link') openView(it, a.key + '/' + s.id); else closeView();
}
window.addEventListener('hashchange', route);
function parentHash(){
  var p = location.hash.replace(/^#/, '').split('?')[0].split('/').filter(Boolean);
  return p.length > 1 ? p[0] : '';
}

// ---------- keyboard and remote clicker ----------
function typing(){ var t = (document.activeElement||{}).tagName || ''; return /INPUT|SELECT|TEXTAREA/.test(t); }
function navItems(){
  var root = document.getElementById('home').classList.contains('hide') ? document.getElementById('page') : document.getElementById('home');
  return Array.prototype.filter.call(root.querySelectorAll('[data-nav], .dk-card, .topics a'), function(e){ return e.offsetParent !== null; });
}
function spatial(dir){
  var list = navItems(); if(!list.length) return false;
  var cur = document.activeElement;
  if(list.indexOf(cur) < 0){ list[0].focus(); list[0].scrollIntoView({block: 'nearest', behavior: 'smooth'}); return true; }
  var r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = null, bd = 1e9;
  list.forEach(function(e){ if(e === cur) return; var b = e.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2, dx = x - cx, dy = y - cy, main, side;
    if(dir === 'L'){ if(dx > -4) return; main = -dx; side = Math.abs(dy); }
    else if(dir === 'R'){ if(dx < 4) return; main = dx; side = Math.abs(dy); }
    else if(dir === 'U'){ if(dy > -4) return; main = -dy; side = Math.abs(dx); }
    else { if(dy < 4) return; main = dy; side = Math.abs(dx); }
    var d = main + side * 2.2; if(d < bd){ bd = d; best = e; } });
  if(best){ best.focus(); best.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }
  return true;
}
document.addEventListener('keydown', function(e){
  if(e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  var k = e.key, open = !V.classList.contains('hide');
  if(open){
    poke();
    if(k === 'Escape'){ if(!isFull()) leave(); return; }
    if(openItem && openItem.type === 'pdf' && PD.doc){
      var tag = (e.target && e.target.tagName) || '';
      if(/^(ArrowLeft|ArrowDown|PageDown| )$/.test(k) || (k === 'Enter' && !/BUTTON|A/.test(tag))){ e.preventDefault(); pdfGo(PD.n + 1); }
      else if(/^(ArrowRight|ArrowUp|PageUp|Backspace)$/.test(k)){ e.preventDefault(); pdfGo(PD.n - 1); }
      else if(k === 'Home'){ e.preventDefault(); pdfGo(1); }
      else if(k === 'End'){ e.preventDefault(); pdfGo(PD.doc.numPages); }
    }
    return;
  }
  if(typing()) return;
  if(k === 'Escape'){ if(location.hash.replace(/^#/, '')){ e.preventDefault(); location.hash = parentHash(); } return; }
  if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.dk-seg')) return;
  var dir = {ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D'}[k];
  if(dir && spatial(dir)){ e.preventDefault(); return; }
  if(/^[1-9]$/.test(k)){
    var homeOn = !document.getElementById('home').classList.contains('hide'), tiles = homeOn ? document.querySelectorAll('#aud .pick') : document.querySelectorAll('#main .stile');
    var t = tiles[+k - 1]; if(t && (homeOn || /^a:/.test(shown))){ e.preventDefault(); t.click(); }
  }
});

// the lecture hall always opens full screen: browsers allow it only after a user action, so the first tap, click or key enters it
(function(){ var done = false; function first(){ if(done) return; done = true; goFull(); ['pointerdown','keydown','touchend'].forEach(function(t){ document.removeEventListener(t, first, true); }); } ['pointerdown','keydown','touchend'].forEach(function(t){ document.addEventListener(t, first, true); }); })();

// ---------- clock ----------
var fT = new Intl.DateTimeFormat('en-GB', {hour: '2-digit', minute: '2-digit', hour12: false}), fD = new Intl.DateTimeFormat('he-IL', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
function tick(){ var d = new Date(), t = fT.format(d), ds = fD.format(d);
  document.querySelectorAll('.clkT').forEach(function(e){ if(e.textContent !== t) e.textContent = t; });
  document.querySelectorAll('.clkD').forEach(function(e){ if(e.textContent !== ds) e.textContent = ds; }); }
tick(); setInterval(tick, 5000);

fill(); landing(); route();
})();
