<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaplan Surgical Academy · צפייה</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C2A35">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--navy:#0C2A35;--g:#00967D;--bg:#EDF2F0;--muted:#5B7078}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Heebo,Arial,sans-serif;height:100%}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
.top a{color:#A9E6C9;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.top h1{flex:1;margin:0;font-size:18px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{all:unset;cursor:pointer;color:#fff;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;white-space:nowrap}
.top button:hover{background:rgba(255,255,255,.12)}
/* one page at a time (22/11/2026, Dr. Gozani: not one long scroll): the page fits the screen, arrows on both sides, keys, swipe */
.one{position:relative;height:calc(100vh - 54px);height:calc(100dvh - 54px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 70px 64px;user-select:none}
.one img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:10px;box-shadow:0 10px 30px -14px rgba(12,42,53,.55)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.45);opacity:.92}
.nav:hover{opacity:1;background:#14404F}.nav:disabled{opacity:.25;cursor:default}
.nav svg{width:26px;height:26px}.nav.nx{left:10px}.nav.pv{right:10px}
.bar{position:absolute;bottom:12px;left:0;right:0;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:12px}
.bar>*{pointer-events:auto}.bar b{background:var(--navy);color:#fff;border-radius:999px;padding:5px 16px;font-size:15px;direction:ltr}
.bar input{width:min(420px,50vw);accent-color:var(--g);direction:rtl}
.all{max-width:1100px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
.all.port{max-width:820px}
.pg{position:relative;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 22px -14px rgba(12,42,53,.5)}
.pg img{display:block;width:100%;height:auto}
.pg i{position:absolute;bottom:8px;left:10px;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:rgba(12,42,53,.6);border-radius:999px;padding:1px 9px}
.err{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted)}
@media (max-width:600px){.top{padding:8px 12px}.top h1{font-size:15px}.one{padding:8px 8px 58px}.nav{top:auto;bottom:6px;transform:none;width:46px;height:46px}.nav.nx{left:8px}.nav.pv{right:8px}.bar{bottom:14px}.bar input{width:44vw}.hint{display:none}.all{padding:10px 8px 40px;gap:10px}}
body.e .one{height:100vh;height:100dvh}
</style>
</head>
<body>
<div class="top"><a href="./">‹ לפורטל האקדמיה</a><h1 id="t">טוען…</h1><button id="mode" type="button" hidden>כל העמודים</button></div>
<main id="p"></main>
<script>
// the PDFs as page images (1/11/2026): hospital computers block downloading PDF files from outside sites, but show images
const DOCS = {
  booklet: ['ספרון הסטאז׳רים', 15, 1], blood: ['נוהל לקיחת דמים · הכנה מראש', 2, 1], preop: ['טרום ניתוח: הסבר וקבלות לדוגמה', 5, 1],
  sem1: ['סמינר 1 · המטופל הכירורגי הדחוף', 26, 0], sem2: ['סמינר 2 · סדנת תפירה', 14, 0],
  sem3: ['סמינר 3 · אפנדיציטיס', 25, 0], sem4: ['סמינר 4 · שוק, נוזלים ואלקטרוליטים', 31, 0]
};
const Q = new URLSearchParams(location.search), k = Q.get('d') || '';
if (Q.get('e')) { document.querySelector('.top').style.display = 'none'; document.body.classList.add('e'); }
const D = DOCS[k], P = document.getElementById('p'), MB = document.getElementById('mode');
const src = i => `pages/${k}/p${('0' + i).slice(-2)}.jpg`;
const SV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M';
let cur = Math.max(1, Math.min(D ? D[1] : 1, +(Q.get('p') || 1))), all = false;
function one() {
  P.className = ''; P.innerHTML = `<div class="one"><div class="hint">חיצים במקלדת או בלחיצה · החלקה בטלפון</div><img id="im" alt="">
    <button class="nav pv" id="pv" aria-label="העמוד הקודם">${SV}9 6l6 6-6 6"/></svg></button><button class="nav nx" id="nx" aria-label="העמוד הבא">${SV}15 6l-6 6 6 6"/></svg></button>
    <div class="bar"><input type="range" id="sl" min="1" max="${D[1]}" value="${cur}" aria-label="מעבר לעמוד"><b id="c"></b></div></div>`;
  document.getElementById('pv').onclick = () => go(cur - 1); document.getElementById('nx').onclick = () => go(cur + 1);
  document.getElementById('sl').oninput = e => go(+e.target.value);
  const im = document.getElementById('im'); let x0 = null;
  im.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  im.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(cur + (dx > 0 ? 1 : -1)); });
  im.onclick = e => { const r = im.getBoundingClientRect(); go(cur + (e.clientX < r.left + r.width / 2 ? 1 : -1)); };
  show();
}
function show() {
  const im = document.getElementById('im'); if (!im) return;
  im.src = src(cur); im.alt = D[0] + ' · עמוד ' + cur; document.getElementById('c').textContent = cur + ' / ' + D[1]; document.getElementById('sl').value = cur;
  document.getElementById('pv').disabled = cur <= 1; document.getElementById('nx').disabled = cur >= D[1];
  [cur + 1, cur + 2, cur - 1].filter(i => i >= 1 && i <= D[1]).forEach(i => { const p = new Image(); p.src = src(i); });
  try { history.replaceState(null, '', location.pathname + '?' + [...Q.entries()].filter(([a]) => a !== 'p').map(([a, b]) => a + '=' + encodeURIComponent(b)).concat(cur > 1 ? ['p=' + cur] : []).join('&')); } catch (e) {}
}
function go(i) { if (!D) return; i = Math.max(1, Math.min(D[1], i)); if (i === cur) return; cur = i; show(); }
function list() {
  P.className = 'all' + (D[2] ? ' port' : ''); let h = '';
  for (let i = 1; i <= D[1]; i++) h += `<div class="pg"><img src="${src(i)}" alt="${D[0]} · עמוד ${i}" loading="${i <= 3 ? 'eager' : 'lazy'}"><i>${i}/${D[1]}</i></div>`;
  P.innerHTML = h;
}
if (!D) { document.getElementById('t').textContent = 'המסמך לא נמצא'; P.innerHTML = '<p class="err">הקישור לא תקין. חוזרים לפורטל האקדמיה ובוחרים מסמך.</p>'; }
else {
  document.title = D[0] + ' · Kaplan Surgical Academy'; document.getElementById('t').textContent = D[0];
  MB.hidden = false; MB.onclick = () => { all = !all; MB.textContent = all ? 'עמוד אחרי עמוד' : 'כל העמודים'; all ? list() : one(); scrollTo(0, 0); };
  one();
  // in Hebrew the next page is to the left: ← next, → previous; also Page Down / space / Home / End
  addEventListener('keydown', e => { if (all) return; const K = e.key;
    if (K === 'ArrowLeft' || K === 'PageDown' || K === ' ') { e.preventDefault(); go(cur + 1); }
    else if (K === 'ArrowRight' || K === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (K === 'Home') go(1); else if (K === 'End') go(D[1]); });
}
</script>
</body>
</html>
