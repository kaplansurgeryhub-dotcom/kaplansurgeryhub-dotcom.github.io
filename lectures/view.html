<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaplan Surgical Academy · צפייה</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C2A35">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--navy:#0C2A35;--g:#00967D;--bg:#EDF2F0;--muted:#5B7078}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Heebo,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
.top a{color:#A9E6C9;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.top h1{flex:1;margin:0;font-size:18px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{color:#A9E6C9;font-size:13px;white-space:nowrap}
.pages{max-width:1100px;margin:0 auto;padding:16px 16px 60px;display:flex;flex-direction:column;gap:14px}
.pages.port{max-width:820px}
.pg{position:relative;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 22px -14px rgba(12,42,53,.5)}
.pg img{display:block;width:100%;height:auto}
.pg i{position:absolute;bottom:8px;left:10px;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:rgba(12,42,53,.6);border-radius:999px;padding:1px 9px}
.err{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
@media (max-width:600px){.top{padding:8px 12px}.top h1{font-size:15px}.pages{padding:10px 8px 40px;gap:10px}}
</style>
</head>
<body>
<div class="top"><a href="./">‹ לפורטל האקדמיה</a><h1 id="t">טוען…</h1><small id="c"></small></div>
<main class="pages" id="p"></main>
<script>
// the PDFs as page images (1/11/2026): hospital computers block downloading PDF files from outside sites, but show images
const DOCS = {
  booklet: ['ספרון הסטאז׳רים', 15, 1], blood: ['נוהל לקיחת דמים · הכנה מראש', 2, 1], preop: ['טרום ניתוח: הסבר וקבלות לדוגמה', 5, 1],
  sem1: ['סמינר 1 · המטופל הכירורגי הדחוף', 26, 0], sem2: ['סמינר 2 · סדנת תפירה', 14, 0],
  sem3: ['סמינר 3 · אפנדיציטיס', 25, 0], sem4: ['סמינר 4 · שוק, נוזלים ואלקטרוליטים', 31, 0]
};
const Q = new URLSearchParams(location.search), k = Q.get('d') || '';
if (Q.get('e')) document.querySelector('.top').style.display = 'none';
const D = DOCS[k], P = document.getElementById('p');
if (!D) { document.getElementById('t').textContent = 'המסמך לא נמצא'; P.innerHTML = '<p class="err">הקישור לא תקין. חוזרים לפורטל האקדמיה ובוחרים מסמך.</p>'; }
else {
  document.title = D[0] + ' · Kaplan Surgical Academy'; document.getElementById('t').textContent = D[0]; document.getElementById('c').textContent = D[1] + ' עמודים';
  if (D[2]) P.classList.add('port');
  let h = ''; for (let i = 1; i <= D[1]; i++) { const n = ('0' + i).slice(-2); h += `<div class="pg"><img src="pages/${k}/p${n}.jpg" alt="${D[0]} · עמוד ${i}" loading="${i <= 3 ? 'eager' : 'lazy'}"><i>${i}/${D[1]}</i></div>`; }
  P.innerHTML = h;
}
</script>
</body>
</html>
